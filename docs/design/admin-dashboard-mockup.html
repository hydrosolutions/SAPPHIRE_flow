<!doctype html>
<!--
  SAPPHIRE Flow administrator dashboard: concept mockup (2026-11-28).
  A single self-contained page for showing project partners. Nothing here is connected to
  a running system and all stations, numbers and names are invented.

  Derived from docs/operations/onboarding-start-here.md and new-station-by-hand.md (station
  journey), model-onboarding.md and model-artifact-import-runbook.md (model versions),
  and issues #450, #455, #501, #538. The commands inside it will drift: check them against
  those documents before relying on them.

  Marked "not built yet" in the page: forecast pause switch, model rollback, model assignment
  switch-off, hydrologist model approval screen, retire/reactivate. Open the file in a browser;
  the web fonts load from Google Fonts and fall back to system fonts offline.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAPPHIRE Flow Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: fixed sidebar + work area. Onboarding is a station-by-station walkthrough: step rail on the left, working pane on the right; stacks on phones. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#EBEFF6; --ink:#121C2B; --ink-2:#4B5A70; --line:#D6DEEA;
  --accent:#0F52BA; --accent-ink:#FFFFFF; --accent-soft:#E2EBFB;
  --ok:#1B7A4B; --ok-bg:#E1F3E9; --warn:#8F5A00; --warn-bg:#FFF0CF; --bad:#B02A22; --bad-bg:#FCE3E0;
  --band:rgba(15,82,186,.16); --obs:#121C2B; --banner-bg:#FFF0CF; --banner-ink:#6B4300;
  --font-display:'Space Grotesk','Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141F; --surface:#151E2C; --surface-2:#1D2839; --ink:#E7EDF7; --ink-2:#97A6BD; --line:#2A3850;
    --accent:#6C9BFF; --accent-ink:#0B1424; --accent-soft:#1B2C4D;
    --ok:#5FD39A; --ok-bg:#12301F; --warn:#F2B84B; --warn-bg:#3A2B0B; --bad:#FF8E85; --bad-bg:#3C1815;
    --band:rgba(108,155,255,.2); --obs:#E7EDF7; --banner-bg:#3A2B0B; --banner-ink:#F2B84B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141F; --surface:#151E2C; --surface-2:#1D2839; --ink:#E7EDF7; --ink-2:#97A6BD; --line:#2A3850;
  --accent:#6C9BFF; --accent-ink:#0B1424; --accent-soft:#1B2C4D;
  --ok:#5FD39A; --ok-bg:#12301F; --warn:#F2B84B; --warn-bg:#3A2B0B; --bad:#FF8E85; --bad-bg:#3C1815;
  --band:rgba(108,155,255,.2); --obs:#E7EDF7; --banner-bg:#3A2B0B; --banner-ink:#F2B84B; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:.95rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:.82rem}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}

.banner{background:var(--banner-bg);color:var(--banner-ink);padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));font-size:.8rem;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.banner button{color:inherit;font-weight:600;cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 34px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.brand i::after{content:"";width:10px;height:10px;background:var(--accent-ink);transform:rotate(45deg);border-radius:2px}
.brand small{display:block;font-family:var(--font-body);font-weight:500;color:var(--ink-2);font-size:.72rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{font-size:.72rem;background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
.nav button[aria-current="page"] .count{background:var(--accent);color:var(--accent-ink)}
.outside{margin-top:auto;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.78rem;color:var(--ink-2)}
.outside b{color:var(--ink)}

.main{padding:0 max(16px,env(safe-area-inset-right,0px)) 40px 24px;min-width:0}
.topbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who label{font-size:.78rem;color:var(--ink-2)}
select,input[type=text],input[type=password],input[type=email],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}
input[readonly]{background:var(--surface-2);color:var(--ink-2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:.78rem}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.page-head p{max-width:64ch;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:3px 10px;font-size:.8rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.link{border-color:transparent;background:none;color:var(--accent);padding:3px 6px}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 10px;font-size:.76rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.idle{background:var(--surface-2);color:var(--ink-2)}
.tag{font-size:.7rem;font-weight:600;border:1px solid var(--line);color:var(--ink-2);border-radius:5px;padding:0 6px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tag.accent{border-color:var(--accent);color:var(--accent)} .tag.warn{border-color:var(--warn);color:var(--warn)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.chip b{color:var(--ink);margin-left:4px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip[aria-pressed="true"] b{color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-pad{padding:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr.focus{background:var(--accent-soft)}
tbody tr:hover{background:var(--surface-2)} tbody tr.focus:hover{background:var(--accent-soft)}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
.sname b{display:block;font-weight:600}
.th-sub{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:.7rem}

.cell{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:.7rem;font-weight:700;border:2px solid var(--line);background:var(--surface)}
.cell.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cell.stopped{background:var(--ink-2);border-color:var(--ink-2);color:var(--surface)}
.cell.cur{border-color:var(--accent);color:var(--accent)}
.cell.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.cell.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.cell.todo{border-style:dashed}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.legend .cell{width:16px;height:16px;border-width:2px;margin-right:6px;vertical-align:middle}

.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}
.callout{border-radius:10px;padding:10px 12px;font-size:.85rem}
.callout.warn{background:var(--warn-bg);color:var(--warn)} .callout.bad{background:var(--bad-bg);color:var(--bad)} .callout.info{background:var(--accent-soft);color:var(--ink)} .callout.ok{background:var(--ok-bg);color:var(--ok)}
.ask{border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;margin-top:20px;background:var(--surface);font-size:.85rem;display:flex;gap:12px;align-items:flex-start}
.ask b{color:var(--accent);white-space:nowrap}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:.78rem;color:var(--ink-2)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
pre{margin:0;background:var(--surface-2);border-radius:10px;padding:12px;overflow-x:auto;font-family:var(--font-mono);font-size:.76rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.mini{display:inline-flex;gap:4px}
.mini span{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:.68rem;font-weight:700}
.mini .ok{background:var(--ok-bg);color:var(--ok)} .mini .bad{background:var(--bad-bg);color:var(--bad)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-size:11px;font-family:var(--font-body)}
.approvebar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;border-radius:0 0 12px 12px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.matrix td,.matrix th{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix input{width:16px;height:16px;accent-color:var(--accent)}
td input[type=number]{width:84px;text-align:right}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tabs button:hover{color:var(--ink)} .tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent);font-weight:600}
.oprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right}
/* walkthrough */
.walk{display:grid;grid-template-columns:292px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:12px;padding:6px 0;max-height:calc(100vh - 24px);overflow-y:auto}
.rail h3{padding:10px 14px 4px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-family:var(--font-body);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.rail h3 span{font-weight:400;letter-spacing:0;text-transform:none}
.rail ul{list-style:none;margin:0;padding:0 6px}
.rail button{width:100%;display:grid;grid-template-columns:22px 1fr;gap:10px;text-align:left;border:0;background:none;border-radius:8px;padding:6px 8px;cursor:pointer;align-items:center}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="step"]{background:var(--accent-soft)}
.rail button small{display:block;color:var(--ink-2);font-size:.72rem}
.rail .cell{width:20px;height:20px;font-size:.66rem}
.kindrow{display:flex;gap:6px;flex-wrap:wrap}
.stepbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface-2)}
.stepbox h3{margin-bottom:6px}
.stepbox ul,.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.needs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.needs li{display:flex;gap:8px;align-items:flex-start}
.needs .ok{color:var(--ok);font-weight:700} .needs .no{color:var(--bad);font-weight:700}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
details summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
details[open] summary{margin-bottom:8px}
.facts td{padding:6px 12px}
.facts .st{font-weight:700;font-size:.74rem;letter-spacing:.04em}
.facts .PASS{color:var(--ok)} .facts .FAIL{color:var(--bad)} .facts .NA{color:var(--ink-2)}
.bar{display:flex;align-items:center;gap:10px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--accent);min-width:3px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tile b{display:block;font-family:var(--font-display);font-size:1.6rem;line-height:1.2}
.todo-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.todo-item:last-child{border-bottom:0}

.login{min-height:calc(100vh - 34px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login-art{background:var(--accent);color:var(--accent-ink);padding:48px max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login-art h1{font-size:2.1rem;max-width:16ch}
.login-art p{max-width:42ch;opacity:.9}
.login-art .brand i{background:var(--accent-ink)} .login-art .brand i::after{background:var(--accent)} .login-art .brand small{color:inherit;opacity:.8}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px max(24px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.login-card .btn{width:100%;padding:10px 14px}
.sep{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:.78rem}
.sep::before,.sep::after{content:"";flex:1;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:500;z-index:20;max-width:calc(100vw - 32px)}

@media (max-width:1000px){ .split{grid-template-columns:minmax(0,1fr)} .walk{grid-template-columns:minmax(0,1fr)} .rail{position:static;max-height:none} }
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);gap:8px 16px}
  .nav{flex-direction:row;overflow-x:auto;width:100%}
  .nav button{white-space:nowrap}
  .outside{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .cols2,.login,.formgrid{grid-template-columns:minmax(0,1fr)}
  .login-art{padding-block:28px} .login-art h1{font-size:1.6rem}
}
@media (prefers-reduced-motion:no-preference){ .btn,.chip,tbody tr{transition:background .12s,filter .12s} }
</style>
</head>
<body>
<div class="banner">
  <span><b>Concept mockup</b> · invented stations and numbers · nothing here is connected to a live system</span>
  <button data-act="reset" type="button">Reset demo</button>
</div>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
const THR = 0.5;
const PHASES = [
  {t:'Basins',tool:'Basin review tool'},{t:'Weather service',tool:'Data Gateway'},{t:'Station setup',tool:'SAPPHIRE'},
  {t:'Observations',tool:'SAPPHIRE + DHM files'},{t:'Readiness',tool:'SAPPHIRE'},{t:'Model',tool:'SAPPHIRE + model team'},{t:'Go live',tool:'SAPPHIRE'}
];
const A='Administrator', H='Hydrologist';
const STEPS = [
  {id:'basin_get',ph:0,t:'Attach the basin package',who:[A],kind:'tool',where:'Basin review tool',batch:1},
  {id:'basin_approve',ph:0,t:'Hydrologist approves each basin',who:[H],kind:'decision',where:'Basin review tool',batch:1},
  {id:'gw_prepare',ph:1,t:'Confirm what to fetch',who:[A,H],kind:'tool',where:'SAPPHIRE',batch:1},
  {id:'gw_register',ph:1,t:'Register basins with the Gateway',who:[A],kind:'tool',where:'SAPPHIRE, writes to the Gateway',batch:1},
  {id:'gw_confirm',ph:1,t:'Confirm in the Gateway admin panel',who:[A],kind:'external',where:'Gateway admin panel',batch:1},
  {id:'gw_subscribe',ph:1,t:'Subscribe to weather products',who:[A],kind:'tool',where:'SAPPHIRE, writes to the Gateway',batch:1},
  {id:'gw_history',ph:1,t:'Start the history jobs',who:[A],kind:'external',where:'Gateway job dashboard',batch:1},
  {id:'gw_verify',ph:1,t:'Verify weather coverage',who:[A],kind:'tool',where:'SAPPHIRE, reads the Gateway'},
  {id:'st_create',ph:2,t:'Create the station record',who:[A],kind:'tool',where:'SAPPHIRE'},
  {id:'st_basin',ph:2,t:'Import basin and static attributes',who:[A],kind:'tool',where:'SAPPHIRE'},
  {id:'st_wx',ph:2,t:'Group and weather connections',who:[A],kind:'tool',where:'SAPPHIRE'},
  {id:'st_hist',ph:2,t:'Load the weather history',who:[A],kind:'tool',where:'SAPPHIRE'},
  {id:'obs_load',ph:3,t:'Load observations, run quality checks',who:[A],kind:'tool',where:'SAPPHIRE, DHM files'},
  {id:'ready',ph:4,t:'Read the readiness report',who:[A,H],kind:'review',where:'SAPPHIRE'},
  {id:'model',ph:5,t:'Import and assign the model',who:[A,'Model team'],kind:'tool',where:'SAPPHIRE'},
  {id:'approve',ph:5,t:'Evaluate and approve the model',who:[H],kind:'future',where:'Model review'},
  {id:'golive',ph:6,t:'Go live',who:[A,'Owner'],kind:'golive',where:'SAPPHIRE'},
  {id:'firstfc',ph:6,t:'Check the first forecast',who:[A],kind:'tool',where:'SAPPHIRE'}
];
const IDX = Object.fromEntries(STEPS.map((s,i)=>[s.id,i]));
const N = STEPS.length;
const STATUS = {
  progress:{t:'Ready for next step',c:'info'}, review:{t:'Needs a hydrologist',c:'info'}, external:{t:'Waiting on others',c:'warn'},

/* ---------- seeded hydrograph (model review) ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function series(s,key){
  const n=92, idx=parseInt(s.id.slice(-2),10), base=Math.sqrt(s.area)*1.1;
  const r=rng(idx*17), peaks=Array.from({length:6},()=>({c:8+r()*76,a:.5+r()*1.6,w:2+r()*3}));
  const obs=Array.from({length:n},(_,d)=>base*(.5+1.1*Math.sin(Math.PI*d/n))+peaks.reduce((q,p)=>q+base*p.a*Math.exp(-((d-p.c)**2)/(2*p.w*p.w)),0));
  const m=s[key], r2=rng(idx*31+(key==='B'?7:3)), noise=(1-m.kge)*.55, spread=.07+(1-m.kge)*.3;
  const med=obs.map(v=>Math.max(2,v*(1+m.bias/100)*(1+(r2()-.5)*2*noise)));
  return {obs,med,lo:med.map(v=>v*(1-spread)),hi:med.map(v=>v*(1+spread*1.3))};
}
function chart(s){
  const d=series(s,S.model), W=640,H=250,L=52,R=12,T=12,B=28, n=d.obs.length;
  const raw=Math.max(...d.hi), step=Math.pow(10,Math.floor(Math.log10(raw/4))), mult=[1,2,2.5,5,10].find(k=>raw/(step*k)<=4.6)||10, tick=step*mult, ymax=tick*Math.ceil(raw/tick);
  const x=i=>L+(W-L-R)*i/(n-1), y=v=>T+(H-T-B)*(1-v/ymax);
  const line=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
  const band=d.hi.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('')+d.lo.map((v,i,a)=>'L'+x(n-1-i).toFixed(1)+' '+y(a[n-1-i]).toFixed(1)).join('')+'Z';
  let grid='';for(let v=0;v<=ymax+1e-9;v+=tick)grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`;
  const xt=[[0,'1 Jul'],[31,'1 Aug'],[62,'1 Sep'],[91,'30 Sep']].map(([i,t],k)=>`<text x="${x(i)}" y="${H-8}" text-anchor="${k===0?'start':k===3?'end':'middle'}">${t}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Observed and simulated discharge at ${esc(s.name)}, July to September 2022">
    ${grid}<text x="${L}" y="${T-1}" text-anchor="start" style="font-size:10px">m³/s</text>
    <path d="${band}" fill="var(--band)" stroke="none"/>
    <path d="${line(d.med)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${line(d.obs)}" fill="none" stroke="var(--obs)" stroke-width="1.6" stroke-linejoin="round"/>
    ${xt}</svg>`;
}
function basinSvg(s){
  const r=rng(parseInt(s.id.slice(-2),10)*11), cx=150,cy=82, pts=Array.from({length:16},(_,i)=>{const a=i/16*Math.PI*2, rad=48+r()*30; return [cx+Math.cos(a)*rad*1.55, cy+Math.sin(a)*rad];});
  const out=pts.reduce((m,p)=>p[1]>m[1]?p:m,pts[0]);
  return `<svg class="chart" viewBox="0 0 300 170" role="img" aria-label="Schematic outline of the basin of ${esc(s.name)} with its outlet"><rect x="0" y="0" width="300" height="170" rx="8" fill="var(--surface-2)"/>
    <path d="M${pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')}Z" fill="var(--band)" stroke="var(--accent)" stroke-width="2"/>
    <path d="M${cx-40} ${cy-60}Q${cx+10} ${cy-10} ${out[0]} ${out[1]}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="${out[0].toFixed(1)}" cy="${out[1].toFixed(1)}" r="5" fill="var(--bad)"/><text x="${(out[0]+9).toFixed(1)}" y="${(out[1]+4).toFixed(1)}">gauge outlet</text></svg>`;
}

function setupTab(s){

  const rail=PHASES.map((p,k)=>{
    const idx=STEPS.map((t,i)=>t.ph===k?i:-1).filter(i=>i>=0);
    return `<h3>${p.t}<span>${p.tool}</span></h3><ul>${idx.map(i=>{const stt=stepState(s,i);return `<li><button data-act="wstep" data-i="${i}" type="button"${i===v?' aria-current="step"':''}>${cell(stt==='cur'?'cur':stt,'')}<span>${STEPS[i].t}<small>${STEPS[i].who.join(' + ')}${STEPS[i].kind==='external'?' · in another tool':STEPS[i].kind==='future'?' · not built yet':''}</small></span></button></li>`;}).join('')}</ul>`;

    <div class="stack">${pane(s,v,stateV)}
      ${ev.length?`<div class="panel"><div class="panel-pad"><h2>Recorded in this session</h2><span class="muted">Kept in the evidence folder, outside any code repository.</span></div><div class="scroll"><table><tbody>${ev.map(e=>`<tr><td class="muted" style="white-space:nowrap">${esc(e.t)}</td><td>${esc(e.who)}</td><td>${esc(e.step)}</td><td class="muted">${esc(e.note)}</td></tr>`).join('')}</tbody></table></div></div>`:''}

}

function pane(s,i,state){
  const stp=STEPS[i], c=content(s,stp.id), perm=stepPerm(stp);
  const where = stp.kind==='external' ? `<span class="tag warn">Done in another tool</span>` : stp.kind==='future' ? '<span class="tag warn">Not built yet</span>' : stp.kind==='decision'||stp.kind==='review' ? '<span class="tag accent">Needs a person\'s judgement</span>' : '<span class="tag accent">Runs from here</span>';
  const head=`<div class="panel panel-pad stack"><div class="row between"><div><div class="eyebrow">${PHASES[stp.ph].t} · step ${i+1} of ${N}</div><h2 style="font-size:1.35rem">${stp.t}</h2></div>
    <div class="kindrow">${where}<span class="tag">${stp.who.join(' + ')}</span><span class="tag">${esc(stp.where)}</span>${stp.batch?'<span class="tag">Can apply to many stations</span>':''}</div></div>
    <p>${esc(c.intro)}</p>`;
  const tail=`${c.cmd?`<details><summary>Under the hood: the command this runs today</summary><pre>${esc(c.cmd)}</pre><p class="muted" style="margin-top:6px">The dashboard runs this for you and keeps the output in the evidence folder.${c.note?' '+esc(c.note):''}</p></details>`:''}
    ${c.stops&&c.stops.length?`<details><summary>If it stops</summary><table><tbody>${c.stops.map(([a,b])=>`<tr><td style="width:36%"><b>${esc(a)}</b></td><td>${esc(b)}</td></tr>`).join('')}</tbody></table></details>`:''}</div>`;
  if(state==='done'){
    return head+`<div class="callout ok"><b>Done</b> · ${finished(s)&&s.last&&i===N-1?esc(s.last):dayStamp(i)} · recorded in the evidence folder</div>
      <div class="stepbox"><h3>What was recorded</h3><ul>${c.result.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>${stp.id==='ready'?factsTable(s,true):''}${tail}`;
  }
  if(state==='future'){
    const lead=STEPS[s.step];
    return head+`<div class="callout info"><b>Not reachable yet.</b> This station is at "${esc(lead.t)}". Earlier steps must finish first.</div>
      ${c.plan?`<div class="stepbox"><h3>What this step will do</h3><ul>${c.plan.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>`:''}${tail}`;
  }
  /* current */
  let body='';
  if(c.needs) body+=`<div class="stepbox"><h3>What you need</h3><ul class="needs">${c.needs.map(([t,ok])=>`<li><span class="${ok?'ok':'no'}">${ok?'✓':'✗'}</span><span>${esc(t)}</span></li>`).join('')}</ul></div>`;
  if(c.warn) body+=`<div class="callout warn">${esc(c.warn)}</div>`;
  if(s.block) body+=blockArea(s,stp);
  else body+=actionArea(s,i,stp,c,perm);
  return head+body+tail;
}
function blockArea(s,stp){

    ${stp.id==='ready'?factsTable(s,false):''}
    <div class="row"><button class="btn" data-act="recheck" data-id="${s.id}" type="button"${dis(stepPerm(stp))}>Check again</button>
    <button class="btn link" data-act="simulate" data-id="${s.id}" type="button" title="Mockup only">Concept: pretend the missing data has arrived</button></div>`;
}
function factsTable(s,done){
  const f=facts(s), bad=f.filter(x=>x[1]==='FAIL').length, ok=f.filter(x=>x[1]==='PASS').length;
  return `<div class="panel"><div class="scroll"><table class="facts"><tbody>${f.map(([n,r,d])=>`<tr><td style="width:170px">${n}</td><td class="st ${r}" style="width:60px">${r==='NA'?'N/A':r}</td><td class="muted">${esc(d)}</td></tr>`).join('')}</tbody></table></div>
    <div class="panel-pad row between"><b>${bad} check${bad===1?'':'s'} failed, ${ok} passed</b><span class="muted">Optional, not counted: Gateway data check · training samples</span></div></div>`;
}
function actorField(){return `<div class="field" style="min-width:200px"><label for="actor">Your name (a label, not a login)</label><input id="actor" type="text" value="${nameNow()}"></div>`;}
function actionArea(s,i,stp,c,perm){
  const key=s.id+':'+stp.id, prev=S.prev.has(key);
  const nAt=S.stations.filter(x=>x.step===i&&!x.block).length;
  const batchBox=stp.batch&&nAt>1?`<label class="switch"><input type="checkbox" id="batchall" checked> <span>Apply to all <b>${nAt}</b> stations waiting at this step</span></label>`:'';
  const gate=perm?'':' disabled title="Your role cannot do this step"';
  const why=perm?'':`<div class="callout info">You are viewing as ${S.role}. This step is for: ${stp.who.join(' + ')}.</div>`;
  if(stp.kind==='future'){
    return `<div class="callout info"><b>Not built yet.</b> Today hydrologists look at forecasts in the flow map and the model team does the evaluation. The proposal is the Model review screen.</div>
      <div class="row"><button class="btn primary" data-act="toreview" data-id="${s.id}" type="button">Open Model review</button></div>`;
  }
  if(stp.kind==='external'){
    const e=c.ext;
    return `<div class="stepbox"><h3>Do this in the other tool</h3><ol class="list">${e.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><div style="margin-top:10px"><button class="btn" data-act="fake" data-t="${esc(e.btn)}" type="button">${esc(e.btn)}</button></div></div>
      ${e.warn?`<div class="callout warn">${esc(e.warn)}</div>`:''}${why}
      <div class="stack">${e.fields.map(([k,l,ph])=>`<div class="field"><label for="x-${k}">${esc(l)}</label><input id="x-${k}" type="text" placeholder="${esc(ph)}"></div>`).join('')}${actorField()}
      ${batchBox}<div class="row"><button class="btn primary" data-act="apply" data-ext="1" type="button"${gate}>I did this, record it and continue</button></div></div>`;
  }
  if(stp.id==='basin_approve'){
    const pub=Math.round(s.area*(1+(parseInt(s.id.slice(-2),10)%5-2)/100));
    return `<div class="cols2"><div>${basinSvg(s)}</div><div class="stack"><dl style="display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0"><dt class="muted">Delineated area</dt><dd style="margin:0;text-align:right" class="num">${s.area.toLocaleString('en-GB')} km²</dd><dt class="muted">Published area</dt><dd style="margin:0;text-align:right" class="num">${pub.toLocaleString('en-GB')} km²</dd><dt class="muted">Difference</dt><dd style="margin:0;text-align:right" class="num">${(((s.area-pub)/pub)*100).toFixed(1)}%</dd><dt class="muted">Outlet snapped by</dt><dd style="margin:0;text-align:right" class="num">210 m</dd></dl>
      <p class="muted">Compare with the river and a trusted drainage area. The extractor's snap audit is a review aid, not proof.</p></div></div>${why}
      <div class="stack">${actorField()}${batchBox}<div class="row"><button class="btn primary" data-act="apply" data-decide="1" type="button"${gate}>Approve basin</button><button class="btn danger" data-act="fake" data-t="Basin rejected (concept). The coordinate goes back to DHM." type="button"${gate}>Reject</button></div></div>`;
  }
  if(stp.id==='ready'){
    return `${factsTable(s,false)}${why}<div class="stack">${actorField()}<div class="row"><button class="btn" data-act="fake" data-t="Report sent to the hydrologist (concept)." type="button">Share report with the hydrologist</button>
      <button class="btn primary" data-act="apply" data-decide="1" type="button"${gate}>Reviewed, continue to the model</button></div></div>`;
  }
  if(stp.id==='golive'){
    const cond=goliveConds(s);
    return `<div class="stepbox"><h3>Seven conditions</h3><ul class="needs">${cond.map(([t,ok])=>`<li><span class="ok">✓</span><span>${esc(t)}</span></li>`).join('')}</ul></div>
      <div class="callout ${S.hostSwitch?'ok':'warn'}"><b>Owner's go-ahead: ${S.hostSwitch?'on':'off'}.</b> Today the owner switches <span class="mono">promotion_allowed</span> on in the host settings for one run, then off again. Going live starts live data collection and puts the station into the forecast cycle. Switching it off later can lose observations.
        <div style="margin-top:8px"><button class="btn small" data-act="hostswitch" type="button">Concept: ${S.hostSwitch?'switch the go-ahead off':'owner switches the go-ahead on'}</button></div></div>${why}
      <div class="stack">${actorField()}<div class="row"><button class="btn" data-act="apply" data-dry="1" type="button">Dry run</button><button class="btn primary" data-act="apply" type="button"${S.hostSwitch&&perm?'':' disabled title="Would be refused: the owner has not given the go-ahead"'}>Go live</button></div></div>`;
  }
  /* generic tool step */
  const formHtml=c.form?`<div class="formgrid">${c.form.map(([l,v],k)=>`<div class="field"><label for="f${k}">${esc(l)}</label><input id="f${k}" type="text" value="${esc(v)}"${k===9?' style="border-color:var(--accent)"':''}></div>`).join('')}</div>`
    :c.inputs?`<div class="formgrid">${c.inputs.map(([l,v],k)=>`<div class="field"><label for="i${k}">${esc(l)}</label><input id="i${k}" type="text" value="${esc(v)}" readonly></div>`).join('')}</div>`:'';
  const planHtml=prev?`<div class="stepbox"><h3>This would happen. Nothing is written yet.</h3><ul>${c.plan.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:'';
  return `${formHtml}${why}${prev?planHtml+`<div class="stack">${actorField()}${batchBox}<div class="row"><button class="btn primary" data-act="apply" type="button"${gate}>Apply</button><button class="btn" data-act="unpreview" data-key="${key}" type="button">Back</button></div></div>`
    :`<div class="row"><button class="btn primary" data-act="preview" data-key="${key}" type="button"${gate}>Preview what will happen</button></div>`}`;
}

function review(){
  const list=S.stations.filter(s=>s.step>=IDX.approve&&s.step<=IDX.firstfc&&s.A);
  const n=[...S.sel].filter(id=>approvable(byId(id))).length;
  const rows=list.map(s=>{
    const m=s[S.model], v=verdict(s), can_=approvable(s), exc=S.exceptions[s.id+S.model];
    return `<tr data-act="pick-r" data-id="${s.id}" class="${s.id===S.focus?'focus':''}" tabindex="0" aria-label="Show ${esc(s.name)}">
      <td><input type="checkbox" data-act="sel" data-id="${s.id}" aria-label="Select ${esc(s.name)}"${S.sel.has(s.id)?' checked':''}${can_&&can('approve')?'':' disabled'}></td>
      <td class="sname"><b>${esc(s.name)}</b><span class="muted">${esc(s.river)}</span></td>
      <td class="num r">${m?fmt(m.kge):'–'}</td><td class="num r">${m?fmt(m.nse):'–'}</td><td class="num r">${m?(m.bias>0?'+':'')+m.bias+'%':'–'}</td><td class="num r">${m?m.cov+'%':'–'}</td>
      <td><span class="mini"><span class="ok" title="Required inputs: passed">I</span><span class="ok" title="Basin geometry: passed">G</span><span class="ok" title="Model compatibility: passed">M</span></span></td>
      <td>${s.step>IDX.approve?'<span class="pill ok">Approved</span>':v?`<span class="pill ${v.c}">${v.t}</span>`:''}${exc?`<div class="muted" style="font-size:.76rem;max-width:200px;white-space:normal">“${esc(exc)}”</div>`:''}</td></tr>`;
  }).join('');
  const f=byId(S.focus), fm=f&&f[S.model];
  let focusPanel='';
  if(f&&fm&&list.includes(f)){

    focusPanel=`<section class="panel panel-pad stack" aria-label="Hydrograph">
      <div class="row between"><div><h2>${esc(f.name)} · ${esc(f.river)}</h2><span class="muted">Hindcast, 1 Jul – 30 Sep 2022, one-day lead</span></div>${v?`<span class="pill ${v.c}">${v.t}</span>`:''}</div>
      <div class="legend"><span><i style="background:var(--obs)"></i>Observed</span><span><i style="background:var(--accent)"></i>Model median</span><span><i style="background:var(--band);height:10px"></i>10–90% range</span></div>
      ${chart(f)}

    .map(([k,t,c])=>`<button data-act="nav" data-view="${k}" type="button"${sel===k?' aria-current="page"':''}>${t}${c!==''?`<span class="count num">${c}</span>`:''}</button>`).join('');
  return `<div class="shell"><aside class="side"><div class="brand"><i></i><div>SAPPHIRE Flow<small>Administration</small></div></div>
    <nav class="nav" aria-label="Main">${nav}</nav>
    <div class="outside"><b>Not in this tool</b><br>Looking at forecasts is done in the SAPPHIRE flow map. It reads the forecast API.</div></aside>
    <main class="main"><div class="topbar"><span class="muted">Nepal · evaluation environment</span>
      <div class="who"><label for="role">Viewing as</label><select id="role" data-act="role">${['Administrator','Hydrologist','Observer'].map(r=>`<option${r===S.role?' selected':''}>${r}</option>`).join('')}</select>
      <span class="avatar" aria-hidden="true">${S.role[0]}</span><button class="btn small" data-act="logout" type="button">Sign out</button></div></div>
      ${content}</main></div>`;
}
const VIEWS={overview,stations:stationsPage,station,models,review,alerts,people};
function render(){ $('#app').innerHTML = S.view==='login'?login():shell(VIEWS[S.view]()); }

/* ---------- actions ---------- */
function advance(s,i){
  const stp=STEPS[i], c=content(s,stp.id), batchEl=$('#batchall');
  const targets=(stp.batch&&batchEl&&batchEl.checked)?S.stations.filter(x=>x.step===i&&!x.block):[s];
  const who=($('#actor')||{}).value||nameNow(), extra=[...document.querySelectorAll('[id^="x-"]')].map(e=>e.value).filter(Boolean).join(' · ');
  targets.forEach(t=>{ t.step=i+1; t.last=stp.t+' done just now'; S.prev.delete(t.id+':'+stp.id);
    S.evidence.push({sid:t.id,t:stamp(),who,step:stp.t,note:extra||c.result[0]});
    if(t.step>=N) S.audit.push({sid:t.id,t:stamp(),who,what:'Went live',why:''}); });
  return targets.length;
}
function afterAdvance(s,i,n){
  S.viewStep = Math.min(i+1,N-1);
  render(); window.scrollTo(0,0);
  toast((n>1?n+' stations moved on. ':'Done. ')+(s.step<N?'Next for '+s.name+': '+STEPS[s.step].t+'.':s.name+' is live. Collecting and forecasting are on.'));
}
function pzApply(){
  const z=S.pz, s=byId(z.id), def=pzDef(s,z.mode+':'+z.what);
  const why=($('#pzwhy')||{}).value||'', who=($('#pzwho')||{}).value||nameNow(), d=dayNow();
  if(why.trim().length<8){toast('Please give a reason (a short sentence).');return;}
  if(def.needsReady&&!z.ready){toast('Run the fresh readiness check first.');return;}
  const rec=(days)=>({who,when:d,days:days||0,why:why.trim()});
  let what='';
  if(z.mode==='pause'){
    if(z.what==='poll'){s.poll='paused';s.pz.poll=rec();what='Polling paused';}
    if(z.what==='fc'){s.fc='paused';s.pz.fc=rec();what='Forecasts paused';}
    if(z.what==='both'){const both=($('#alsopoll')||{checked:true}).checked;s.fc='paused';s.pz.fc=rec();if(both){s.poll='paused';s.pz.poll=rec();}what=both?'Retired: forecasts and polling paused':'Retired: forecasts paused, polling kept';}
  } else {
    if(z.what==='poll'||z.what==='both'){ if(s.poll==='paused'){const days=s.pz.poll?s.pz.poll.days:0; s.gap=days>0?{days}:null; s.poll='on'; s.pz.poll=null;} }
    if(z.what==='fc'||z.what==='both'){ s.fc='on'; s.pz.fc=null; }
    what=z.what==='poll'?'Polling resumed':z.what==='fc'?'Forecasts resumed':'Reactivated: polling and forecasts resumed';
  }
  s.last=what+' just now';
  S.audit.push({sid:s.id,t:stamp(),who,what,why:why.trim()});
  S.pz=null; render(); toast(what+'. Recorded in the history.');
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act, id=el.dataset.id;
  if(el.tagName==='INPUT'&&a!=='sel') return;
  if(el.tagName==='SELECT') return;
  switch(a){
    case 'login': go('overview'); break;
    case 'logout': go('login'); break;
    case 'nav': go(el.dataset.view); break;
    case 'reset': S=initial(); location.hash='login'; render(); toast('Demo reset'); break;
    case 'filter': S.filter=el.dataset.f; render(); break;
    case 'sview': S.sview=el.dataset.v; render(); break;
    case 'open': S.focus=id; S.tab=null; S.viewStep=null; S.pz=null; go('station'); break;
    case 'tab': S.tab=el.dataset.t; S.pz=null; render(); break;
    case 'wstep': S.viewStep=+el.dataset.i; render(); break;
    case 'preview': S.prev.add(el.dataset.key); render(); break;
    case 'unpreview': S.prev.delete(el.dataset.key); render(); break;
    case 'fake': toast(/concept/i.test(el.dataset.t)?el.dataset.t:'Concept: this would open the other tool in a new tab. Nothing is sent from here.'); break;
    case 'newbatch': S.newBatch=!S.newBatch; render(); break;
    case 'newbatch-go': S.newBatch=false; render(); toast('Concept: the batch would be created and the first station opened in the walkthrough.'); break;
    case 'hostswitch': S.hostSwitch=!S.hostSwitch; render(); break;
    case 'recheck': { const s=byId(id), b=s.block; S.rc[id]=(S.rc[id]||0)+1;
      if(b.who==='Gateway'&&S.rc[id]>=2){ s.block=null; render(); toast('Coverage complete. '+s.name+' is eligible.'); }
      else { toast(b.who==='Gateway'?'Still 3 days missing. The Gateway is processing.':'Nothing new has arrived from '+b.who+'.'); } break; }
    case 'simulate': { const s=byId(id); s.block=null; s.dhmMissing=false; render(); toast('Concept: data arrived. The station can continue.'); break; }
    case 'apply': {
      const s=byId(S.focus), i=s.step; if(el.dataset.dry){ toast('Dry run: all seven conditions hold. Nothing was written.'); return; }
      if(el.dataset.ext){ const inputs=[...document.querySelectorAll('[id^="x-"]')]; if(inputs.some(x=>!x.value.trim())){ toast('Write what you saw, so it can be recorded.'); inputs.find(x=>!x.value.trim()).focus(); return; } }
      const n=advance(s,i); afterAdvance(s,i,n); break; }
    case 'pz-open': S.pz={id,what:el.dataset.what,mode:el.dataset.mode,ready:false}; render(); break;
    case 'pz-cancel': S.pz=null; render(); break;
    case 'pz-ready': S.pz.ready=true; render(); toast('Readiness check run: 13 facts, 0 failed.'); break;
    case 'pz-do': pzApply(); break;
    case 'catchup': byId(id).gap=null; render(); toast('Catch-up marked done (concept).'); break;
    case 'art': S.artSel=id; S.artForm=null; render(); break;
    case 'toart': S.artSel=id; S.artForm=null; go('models'); break;
    case 'art-form': S.artForm={id,kind:el.dataset.k}; render(); break;
    case 'art-cancel': S.artForm=null; render(); break;
    case 'art-do': {
      const f=S.artForm, k=el.dataset.k||f.kind, x=S.arts.find(v=>v.id===f.id), why=($('#awhy')||{}).value||'', who=($('#awho')||{}).value||nameNow(), d=dayNow();
      if(why.trim().length<8){toast('Please give a reason (a short sentence).');return;}
      const inc=S.arts.find(v=>v.status==='active'&&v!==x), row=(what)=>S.log.push({t:stamp(),who,st:'Group nepal-batch3',model:'cmal_small '+x.v,what,note:why.trim()});
      if(k==='approve'||k==='rollback'){ if(inc){inc.status='superseded';inc.decision='Superseded '+d+' by '+x.v;} x.status='active'; x.decision='Active since '+d+' · '+who; row(k==='approve'?'Approved and activated; '+(inc?inc.v+' superseded':''):'Made active again; '+(inc?inc.v+' superseded':'')); toast(x.v+' is now active.'+(inc?' '+inc.v+' superseded.':'')); }
      if(k==='reject'){ x.status='rejected'; x.decision='Rejected '+d+' · '+who; x.reason=why.trim(); row('Rejected'); toast(x.v+' rejected. The active version is unchanged.'); }
      if(k==='stop'){ S.assign.status='INACTIVE'; S.assign.why=why.trim(); row('Assignment switched off'); toast('Assignment switched off. Stations with a fallback use linreg; the others stop forecasting.'); }
      S.artForm=null; render(); break; }
    case 'assign-on': { S.assign.status='ACTIVE'; S.log.push({t:stamp(),who:nameNow(),st:'Group nepal-batch3',model:'cmal_small '+activeArt().v,what:'Assignment switched back on',note:''}); render(); toast('Assignment switched back on.'); break; }
    case 'train-done': { const x=S.arts.find(v=>v.id===id); x.status='pending_approval'; x.trained=dayNow(); x.sha=hex4()+'…'+hex4(); x.decision='Ready for review since '+dayNow(); x.note='Evaluated on held-out dates (concept).'; render(); toast(x.v+' is ready for review.'); break; }
    case 'add-open': S.add={route:'import',preview:false}; render(); break;
    case 'add-cancel': S.add=null; render(); break;
    case 'add-route': S.add.route=el.dataset.r; S.add.preview=false; render(); break;
    case 'add-preview': S.add.preview=true; render(); break;
    case 'add-preview-off': S.add.preview=false; render(); break;
    case 'add-do': {
      const r=S.add.route, n=S.vn++, d=dayNow(), who=nameNow(), inc=activeArt();
      const x={id:'a-v'+n,v:'v'+n,model:'cmal_small',trained:d,sha:hex4()+'…'+hex4(),prov:'Known',lineage:'',reason:'',note:''};
      if(r==='import'){ if(inc){inc.status='superseded';inc.decision='Superseded '+d+' by import of '+x.v;} Object.assign(x,{status:'active',src:'Imported',period:'2000 – 2018',decision:'Active since '+d+' · '+who}); S.log.push({t:stamp(),who,st:'Group nepal-batch3',model:'cmal_small '+x.v,what:'Imported and activated'+(inc?'; '+inc.v+' superseded':''),note:''}); toast('Imported. '+x.v+' is active at once'+(inc?' and '+inc.v+' is superseded.':'.')); }
      else { Object.assign(x,{status:'training',trained:'–',sha:'pending',src:r==='train'?'Trained here':'Fine-tuned here (donor '+(inc?inc.v:'–')+')',period:r==='train'?'2000 – 2018':'Fitting 2010 – 2016, evaluation 2017 – 2020',lineage:r==='fine'?'Warm start from '+(inc?inc.v:'–')+', LoRA rank 8':'',decision:'Training started '+d+' · '+who,note:'Fitting is running. The active version keeps forecasting.'}); toast('Training started. '+x.v+' will wait for review; '+(inc?inc.v:'the current version')+' keeps forecasting.'); }
      S.arts.push(x); S.artSel=x.id; S.add=null; render(); break; }
    case 'toreview': S.focus=id; go('review'); break;
    case 'toreview-b': S.model='B'; go('review'); break;
    case 'model': S.model=el.dataset.m; S.excOpen=false; render(); break;
    case 'pick-r': if(e.target.tagName==='INPUT') return; S.focus=id; S.excOpen=false; render(); break;
    case 'sel': e.stopPropagation(); el.checked?S.sel.add(id):S.sel.delete(id); render(); break;
    case 'exc-open': S.excOpen=true; render(); break;
    case 'exc-cancel': S.excOpen=false; render(); break;
    case 'exc-save': { const why=($('#exc').value||'').trim(); if(why.length<8){toast('Please give a reason (at least a short sentence).');return;}
      S.exceptions[id+S.model]=why; S.excOpen=false; render(); toast('Exception recorded. It stays visible next to the results.'); break; }
    case 'approve': {
      const name=($('#rev').value||'').trim(); const ids=[...S.sel].filter(i=>approvable(byId(i)));
      if(!ids.length){toast('Select at least one station that meets the threshold or has an exception.');return;}
      if(!name){toast('Enter your name first. It is recorded with the decision.');$('#rev').focus();return;}
      ids.forEach(i=>{const s=byId(i);s.step=IDX.golive;s.last='Model approved just now by '+name;
        S.log.push({t:stamp(),who:name,st:s.name,model:MODELS[S.model].split(' · ')[0],what:'Approved'+(S.model==='B'?' (candidate)':''),note:S.exceptions[i+S.model]||''});});
      S.sel.clear(); render(); toast(ids.length+' station'+(ids.length>1?'s':'')+' approved. Next step in each walkthrough: Go live.'); break; }
    case 'invite': S.users.push({id:'u'+(S.users.length+1),name:'New person (invited)',org:'NHS',role:'Observer',st:'Invited',last:'Never'}); render(); toast('Invitation sent (concept).'); break;
  }
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act]')){e.preventDefault();e.target.click();} });
document.addEventListener('change',e=>{
  const el=e.target, a=el.dataset.act;
  if(a==='role'){S.role=el.value;render();toast('Now viewing as '+el.value+'.');}
  else if(a==='wstation'){S.focus=el.value;S.viewStep=null;S.tab=null;S.pz=null;render();}
  else if(a==='perm'){S.perms[el.dataset.role][el.dataset.perm]=el.checked?1:0;render();}
  else if(a==='urole'){S.users.find(u=>u.id===el.dataset.id).role=el.value;toast('Role updated (concept).');}
  else if(a==='cap'){S.capOn=el.checked;render();}
  else if(el.name==='deliv'){S.deliv=el.value;render();}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.act==='thr'){byId(el.dataset.id).thr[+el.dataset.k]=+el.value||0;const p=$('#cap-pre');if(p)p.innerHTML=capPreview();}
  if(el.dataset.act==='ep')S.endpoint=el.value;
});
const ROUTES=['login','overview','stations','station','models','review','alerts','people'];
function go(v){S.view=v;S.excOpen=false;if(location.hash!=='#'+v)location.hash=v;render();window.scrollTo(0,0);}
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(ROUTES.includes(v)&&v!==S.view){S.view=v;render();}});
{const v=location.hash.slice(1);if(ROUTES.includes(v))S.view=v;}
render();
})();
</script>
