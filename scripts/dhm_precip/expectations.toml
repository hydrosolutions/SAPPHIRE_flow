# Plan 158 (M-A1) — the a-priori expectation manifest (D8).
#
# Authored BEFORE the statistic code that gates it (D8). Every `id` is
# computed once by the runner (scripts/dhm_precip/run.py) and compared here
# under D5's tolerance rule: quoted-precision rounding, exact match. Counts
# are exact; quoted ranges assert min/max over the named population.
#
# `source = "vision-findings"` entries derive solely from
# docs/design/dhm-precipitation-vision.md's Findings section (`vision_ref`,
# file:line). `source = "plan-158"` is the D12 geometry class this plan
# itself introduces (`plan_ref`).
#
# `disposition`: active (must match) | corrected (vision edited, new value
# asserted too) | withdrawn_unreproducible (the only disposition exempt from
# numeric matching; requires a complete Phase-4 record). See D8c.
#
# PHASE 4a RECONCILED (task 4a) — the real evaluator ran against the real
# file (sha256 8dc57e43…f98f57). 24 of 38 expectations reproduced exactly
# (`active`); 2 were `corrected` (a scope refinement and a draft-estimate
# supersession); 12 are `withdrawn_unreproducible`. Every mismatch was
# investigated for a pipeline bug before disposition — two real bugs were
# found and fixed (a literal "NaN"-string cell silently poisoning sums, and
# an over-strict stuck-high adjacency tolerance/missing magnitude floor that
# hid the Sindhuli Madhi block entirely). The remainder is the pattern D6
# predicted: every `RAW_AXIS_DIAGNOSTIC`/`AXIS_INDEPENDENT` expectation
# (row counts, geometry) reproduced exactly; every `RAW_PROVISIONAL`
# expectation computed on unmasked ON_GRID data (intensity quantiles, shape
# ratios, sub-threshold mass, coherence correlations, DJF share, the
# missingness ratio) did not — M-A1 builds no exclusion mask, so candidate
# defects (sentinels, stuck-high blocks, unadjudicated zero runs) remain in
# the population these statistics are computed over. That is exactly the
# D11 successor split: M-A2 (axis normalisation), M-A3 (the QC mask) and
# M-A7 (temporal characterisation) are where these families get a real shot
# at reproducing.

