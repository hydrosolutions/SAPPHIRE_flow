enable_observation_alerts = true

# Plan 026 multi-model combination, enabled on this deployment 2026-08-27.
# `primary` (the default) runs the priority fallback chain and stops at the
# first success — one forecast per station per cycle, so a lower-priority
# model only ever runs when a higher-priority one FAILS. `pooled` runs EVERY
# assigned model and additionally stores a `_pooled` grand ensemble
# (`combination_strategy`/`source_model_ids`, fallback-tier models excluded
# from the combination by ModelTier, not by priority).
#
# Enabled because the Forecast Lab export (Plan 198) exists to COMPARE models,
# and under `primary` it could only ever see one. Measured cost on this box:
# 2 -> 12 forecasts per cycle for +40s (425.0s -> 465.5s), because the cycle is
# ~95% NWP download, which is fixed per cycle and independent of model count.
forecast_combination_strategy = "pooled"

# Plan 111 route-C BAFU forecast collector. Setting this path ENABLES the
# hourly collect-bafu-forecasts flow (gated: unset = no-op). Quarantined,
# host-persistent named volume (docker-compose.yml `bafu_forecast_archive`);
# evaluation-only, forward-only. Discard with `docker volume rm`.
[adapters.bafu_forecast]
archive_base_path = "/data/bafu_forecasts"

# Plan 136 BAFU LINDAS observation archive collector. Setting this path
# ENABLES the collect-bafu-observations flow (gated: unset = no-op). Plan 176
# D1: polls ~18-20x/hour (over-polling a measured 10-minute publish grid,
# not the old hourly-at-:37 assumption) on the `ingest` work pool (D5).
# Quarantined, host-persistent named volume (docker-compose.yml
# `bafu_observation_archive`); evaluation-only, forward-only, keyed on
# (gauge_code, lindas_kind) — not an onboarded station. Discard with
# `docker volume rm`.
[adapters.bafu_observation]
archive_base_path = "/data/bafu_observations"

[adapters.weather_forecast]
enabled = true
# Plan 105 D2 — disk-guard thresholds (absolute free GB).
# Scratch = /tmp/sapphire_nwp (4 GiB tmpfs); archive = /data/nwp_grids volume.
disk_guard_scratch_soft_gb = 1.5
disk_guard_scratch_hard_gb = 0.5
disk_guard_archive_soft_gb = 8.0
disk_guard_archive_hard_gb = 3.0
