# docker-compose.staging.yml — adds the 5-station staging overlay on top of docker-compose.yml.
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up
#
# See docs/plans/065-config-overlay-environment-variants.md T4/D8.

services:
  prefect-worker:
    environment:
      SAPPHIRE_CONFIG_OVERLAY: /app/config/overlays/staging-5-stations.toml
    volumes:
      - ./config/overlays/staging-5-stations.toml:/app/config/overlays/staging-5-stations.toml:ro

  prefect-worker-ingest:
    environment:
      SAPPHIRE_CONFIG_OVERLAY: /app/config/overlays/staging-5-stations.toml
    volumes:
      - ./config/overlays/staging-5-stations.toml:/app/config/overlays/staging-5-stations.toml:ro

  # prefect-worker-forecast-cycle (Plan 157 D13/T2) runs the forecast cycle —
  # the SAME flow that used to run on prefect-worker — so it needs the SAME
  # config overlay, or the staging 5-station cycle would silently run
  # against the default (non-staging) config the moment the pool split
  # shipped.
  prefect-worker-forecast-cycle:
    environment:
      SAPPHIRE_CONFIG_OVERLAY: /app/config/overlays/staging-5-stations.toml
    volumes:
      - ./config/overlays/staging-5-stations.toml:/app/config/overlays/staging-5-stations.toml:ro

  api:
    environment:
      SAPPHIRE_CONFIG_OVERLAY: /app/config/overlays/staging-5-stations.toml
    volumes:
      - ./config/overlays/staging-5-stations.toml:/app/config/overlays/staging-5-stations.toml:ro

  init:
    environment:
      SAPPHIRE_CONFIG_OVERLAY: /app/config/overlays/staging-5-stations.toml
    volumes:
      - ./config/overlays/staging-5-stations.toml:/app/config/overlays/staging-5-stations.toml:ro
