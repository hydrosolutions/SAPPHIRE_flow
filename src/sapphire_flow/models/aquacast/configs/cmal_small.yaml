  batch_size: 2056
  num_workers: 4
  stride: 7
  validator_daily:
    validation_mode: drop_input_nan_target_forecast
  quality_control:
    splits:
    - train
    - val
    - test
    plausible_cap: 500
    suspicious_threshold: 300
    z_max: 3.0
  augmentations:
  - feature: discharge
    p_channel: 0.4
    p_random: 0.25
    element_probability: 0.1
model:
  type: composed
  hidden_size: 256
  dropout_token: 0.0
  dropout_backbone: 0.4
  tokenizer:
    type: factored
    static:
      network: mlp
      hidden_dims:
      - 100
      - 64
      - 16
      activation:
      - tanh
      - tanh
      - linear
      dropout: 0.3
    dynamic:
      network: identity
  backbone:
    type: lstm
    num_layers: 1
    dropout: 0.4
  head:
    type: cmal
    num_components: 3
training:
  max_epochs: 50
  check_val_every_n_epoch: 1
  precision: bf16-mixed
  optimizer:
    optimizer:
      type: adamw
      lr: 0.0008
      weight_decay: 1e-6
    scheduler:
      type: cosine
      t_max: 50
      min_lr: 5.0e-05
  loss:
    function: cmal_nll
    weights:
      daily: 1.0
    lambda_mse: 0.0
  checkpoint:
    load: last
  early_stopping:
    enabled: false
  progress_bar: true
  verbose_validation_every_n: 1
  augmentations:
    target_noise:
      enabled: true
      sigma: 0.01
      sigma_abs: 0.001
  max_grad_steps_per_epoch: 2048
inference:
  strategy:
    kind: point
  n_aleatoric: 200
  quantile_levels:
  - 0.05
  - 0.1
  - 0.25
  - 0.5
  - 0.75
  - 0.9
  - 0.95
  stride: 3
evaluation:
  forecast_type: probabilistic
  metrics:
  - nse
  - kge
  - persistence_index
  - coverage_50
  - coverage_80
  - coverage_90
