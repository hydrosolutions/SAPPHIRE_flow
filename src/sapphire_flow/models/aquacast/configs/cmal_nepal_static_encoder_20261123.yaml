name: nepal_aligned_cmal_static_encoder
output_dir: experiments/nepal/aligned/runs/cmal/static_encoder
seed: 42
resolutions:
- daily
supervised:
- daily
window:
  lookback_days: 365
  forecast_days: 15
  issue_hours:
  - 0
  sub_daily_step_hours: 1
daily:
  targets:
  - discharge
  is_target_in_past: true
  past_dynamic:
  - discharge
  future_dynamic:
  - precipitation
  - mean_temperature
  - thermal_net_radiation
  - solar_net_radiation
static_features:
- area
- slope
- stream_gradient
- lake_fraction
- air_temperature
- precip_annual
- pet_annual
- aet_annual
- aridity_index
- climate_moisture_index
- snow_cover
- snow_cover_max
- glacier_fraction
- cropland_fraction
- pasture_fraction
- clay_fraction
- silt_fraction
- sand_fraction
- soil_organic_carbon
- soil_water_content
- karst_fraction
- irrigated_fraction
- p_mean
- frac_snow
- high_prec_freq
- high_prec_dur
- low_prec_freq
- low_prec_dur
- glc_pc_s01
- glc_pc_s02
- glc_pc_s03
- glc_pc_s04
- glc_pc_s05
- glc_pc_s06
- glc_pc_s07
- glc_pc_s08
- glc_pc_s09
- glc_pc_s10
- glc_pc_s11
- glc_pc_s12
- glc_pc_s13
- glc_pc_s14
- glc_pc_s15
- glc_pc_s16
- glc_pc_s17
- glc_pc_s18
- glc_pc_s19
- glc_pc_s20
- glc_pc_s21
- glc_pc_s22
- forest_fraction
- permafrost_fraction
- pnv_pc_s01
- pnv_pc_s02
- pnv_pc_s03
- pnv_pc_s04
- pnv_pc_s05
- pnv_pc_s06
- pnv_pc_s07
- pnv_pc_s08
- pnv_pc_s09
- pnv_pc_s10
- pnv_pc_s11
- pnv_pc_s12
- pnv_pc_s13
- pnv_pc_s14
- pnv_pc_s15
- wet_pc_s01
- wet_pc_s02
- wet_pc_s03
- wet_pc_s04
- wet_pc_s05
- wet_pc_s06
- wet_pc_s07
- wet_pc_s08
- wet_pc_s09
- wet_pc_sg1
- wet_pc_sg2
data:
  data_root: ../workspace/data
  basins_files:
    train: configs/basins/nepal_finetune/nepal.txt
  regions:
  - nepal
  region_configs:
    nepal: configs/regions/nepal.yaml
  splits:
    train:
    - '1980-01-01'
    - '2012-12-31'
  batch_size: 256
  num_workers: 0
  stride: 1
  validator_daily:
    validation_mode: drop_input_nan_target_forecast
  quality_control:
    splits: []
  augmentations:
  - feature: discharge
    p_channel: 0.4
    p_random: 0.25
    element_probability: 0.1
  use_staged_daily: true
  loading:
    mode: memory
  training_supervision_file: configs/nepal_finetune/nepal_policy.parquet
  training_samples_per_epoch: 262144
model:
  type: composed
  hidden_size: 512
  dropout_token: 0.0
  dropout_backbone: 0.4
  tokenizer:
    type: factored
    static:
      network: mlp
      hidden_dims:
      - 100
      - 64
      - 16
      activation:
      - tanh
      - tanh
      - linear
      dropout: 0.3
    dynamic:
      network: identity
  backbone:
    type: lstm
    num_layers: 1
    dropout: 0.4
  head:
    type: cmal
    num_components: 3
  time_convention:
    daily: start
training:
  max_epochs: 20
  precision: bf16-mixed
  optimizer:
    optimizer:
      type: adamw
      lr: 5.0e-05
      weight_decay: 1.0e-06
  loss:
    function: cmal_nll
    weights:
      daily: 1.0
    lambda_mse: 0.0
  checkpoint:
    load: last
    save_last: true
  early_stopping:
    enabled: false
  progress_bar: false
  verbose_validation_every_n: 1
  augmentations:
    target_noise:
      enabled: false
      sigma: 0.01
      sigma_abs: 0.001
inference:
  strategy:
    kind: point
  n_aleatoric: 200
  quantile_levels:
  - 0.05
  - 0.1
  - 0.25
  - 0.5
  - 0.75
  - 0.9
  - 0.95
  stride: 1
evaluation:
  forecast_type: probabilistic
  metrics:
  - nse
  - kge
  - persistence_index
  - coverage_50
  - coverage_80
  - coverage_90
finetuning:
  strategy: static_encoder
  lr: 5.0e-05
  normalization: pretrained
device: cpu
