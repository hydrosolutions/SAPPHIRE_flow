schema_version = 1
name = "nepal"
state = "legacy"
base_config = "../../../config.toml"
overlays = ["../../../config/overlays/nepal-cloud.toml"]
compose_files = ["../../../docker-compose.yml", "../../../docker-compose.nepal-cloud.yml"]
runbook = "../../../docs/deployment/nepal-cloud-host.md"

[[scopes]]
kind = "chwrr_import"
when_compose = "../../../docker-compose.operator.yml"
base_config = "../../../config.toml"
overlays = ["../../../config/overlays/chwrr-import.toml"]

[[scopes]]
kind = "forecast_only"
when_compose = "../../../docker-compose.nhs-forecast.yml"
provider_input = "NHS_PROVIDER_CONFIG_SOURCE"

[secret_requirements.db_password]
use = "runtime"
consumers = ["postgres", "prefect-server", "init"]

[secret_requirements.sapphire_api_db_password]
use = "runtime"
consumers = ["api", "init"]

[secret_requirements.sapphire_worker_db_password]
use = "runtime"
consumers = ["prefect-worker", "prefect-worker-ingest", "init"]

[secret_requirements.sapphire_backup_db_password]
use = "runtime"
consumers = ["prefect-worker-backup", "init"]

[secret_requirements.access_token_pepper]
use = "runtime"
consumers = ["api"]

[secret_requirements.recap_dg_client_token]
use = "build"
consumers = ["prefect-worker", "prefect-worker-ingest", "prefect-worker-backup", "api", "init"]
environment_name = "RECAP_DG_CLIENT_TOKEN"

[secret_requirements.aquacast_token]
use = "build"
consumers = ["prefect-worker"]
environment_name = "AQUACAST_TOKEN"

[secret_requirements.sapphire_operator_db_password]
use = "runtime"
consumers = ["operator", "init"]
when_compose = "../../../docker-compose.operator.yml"

[secret_requirements.sapphire_dg_api_key]
use = "runtime"
consumers = ["prefect-worker", "prefect-worker-ingest"]
when_compose = "../../../docker-compose.recap.yml"
