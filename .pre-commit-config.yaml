# Pre-commit hook configuration for SAPPHIRE Flow.
#
# Pin revisions: mutable tags are a supply-chain risk (same reasoning as
# GitHub Actions pins in ci.yml). Update quarterly until Dependabot or
# Renovate gains pre-commit support.
#
# Pins chosen 2026-05-11:
#   ruff-pre-commit         v0.15.12  (astral-sh/ruff-pre-commit)
#   pre-commit-hooks        v6.0.0    (pre-commit/pre-commit-hooks)
#   gitleaks                v8.30.1   (gitleaks/gitleaks)
#
# Hooks are restricted to tracked source paths via per-hook `files:`
# patterns. Pre-commit defaults scan all changed files; explicit patterns
# avoid surprises on notebooks/, data/, etc.
#
# All ruff hooks are CHECK-ONLY (no auto-fix). See D8 in
# docs/plans/archive/070-precommit-and-gate-parity.md for the rationale
# (auto-fix conflicts with the mandatory bump-my-version commit sequence
# documented in CLAUDE.md §Version Bumping).
#
# default_install_hook_types: a bare `pre-commit install` (no --hook-type
# flags) now registers pre-commit + pre-push + post-commit, so a NEW clone
# gets the Plan 200 D4 unpushed-main nudge without needing the long-form
# command from CLAUDE.md/README.md/AGENTS.md. An EXISTING clone that already
# ran the old two-type install must still re-run that command once (or
# `pre-commit install` again) to pick up post-commit -- pre-commit only
# registers the hook types actually requested at install time.
default_install_hook_types: [pre-commit, pre-push, post-commit]

repos:
  # ── ruff: lint + format check (fastest; check-only per D8) ──────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: []
        files: ^(src|tests|docs|\.github|scripts|tools)/
      - id: ruff-format
        args: [--check]
        files: ^(src|tests|docs|\.github|scripts|tools)/

  # ── basic hygiene (trailing whitespace, EOF newline, merge conflicts) ────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(src|tests|docs|\.github|scripts|tools)/
      - id: end-of-file-fixer
        files: ^(src|tests|docs|\.github|scripts|tools)/
      - id: check-merge-conflict
        files: ^(src|tests|docs|\.github|scripts|tools)/
      - id: check-added-large-files
        files: ^(src|tests|docs|\.github|scripts|tools)/

  # ── Mac-mini ops scripts: check-only shell/plist lint ───────────────────
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck Mac-mini scripts
        # -x: follow `source` (Plan 199 T2 — docker-endpoint.sh is sourced,
        # not executed, by every launchd wrapper; plain shellcheck can't see
        # into it and flags the `source` line itself as SC1091).
        entry: shellcheck -x
        language: system
        files: ^(scripts/launchd/.*\.sh|scripts/bootstrap-mac-mini\.sh|scripts/codex-review\.sh)$
        types_or: [shell]
      - id: plutil-launchd
        name: plutil launchd plists
        entry: bash -c 'command -v plutil >/dev/null 2>&1 || exit 0; plutil -lint "$@"' --
        language: system
        files: ^scripts/launchd/.*\.plist$

  # ── unpushed-main nudge: warns, never blocks (Plan 200 D4) ───────────────
  # Work stranded on one local checkout recurred 3x in 4 days (Plan 200). Runs
  # POST-commit (the new commit must exist to be counted) so it fires on the
  # FIRST unpushed commit, not only the second+ -- a pre-commit-stage version
  # would stay silent in exactly that case. Silent on every branch but `main`,
  # and always exits 0: a hard block on "commits exist that aren't pushed" would
  # fire on nearly every ordinary commit sequence and be disabled within a day.
  - repo: local
    hooks:
      - id: unpushed-main-nudge
        name: unpushed commits on main nudge
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false
        entry: bash -c 'b=$(git rev-parse --abbrev-ref HEAD 2>/dev/null); [ "$b" = "main" ] || exit 0; git rev-parse --verify -q origin/main >/dev/null 2>&1 || exit 0; n=$(git rev-list --count origin/main..main 2>/dev/null); [ -n "$n" ] && [ "$n" -gt 0 ] || exit 0; echo "note -- $n commit(s) on main not yet pushed -- remember, git push origin main"; exit 0'

  # ── pyright ratchet: slower type gate, so run before push ───────────────
  - repo: local
    hooks:
      - id: pyright-ratchet
        name: pyright ratchet
        language: system
        pass_filenames: false
        stages: [pre-push]
        entry: bash -c 'uv run pyright --outputjson src/ > /tmp/pyright.json || true; uv run python tools/pyright_ratchet.py /tmp/pyright.json tools/pyright_baseline.json'

  # ── gitleaks: secret pattern detection (belt-and-suspenders) ────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        files: ^(src|tests|docs|\.github|scripts|tools)/
