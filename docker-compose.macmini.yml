# docker-compose.macmini.yml — Mac-mini staging overlay.
# Layers on top of docker-compose.yml for single-host Mac-mini deployments.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.macmini.yml up -d
#
# What this overlay does:
#   * Binds /Volumes/sapphire-backup/pg_dumps (USB SSD) into the
#     prefect-worker-backup's /data/backups (Plan 162 D2: the dedicated
#     backup component, not the shared prefect-worker). Shadows the named
#     `backups` volume so nightly pg_dumps land on the removable disk.
#   * Binds /Users/sapphire/camels-ch (pre-staged host directory) into
#     /data/raw read-only. Required by onboard-stations after Plan 060
#     removed the sapphire_data:/data/raw mount from the base compose.
#   * Exposes the API on the host (port 8000) so the watchdog on the
#     host can probe http://localhost:8000/api/v1/health, and so
#     team laptops can SSH-tunnel into the LAN-side API.
#   * LAN-only/plain HTTP; no caddy TLS here (public HTTPS is Plan 049).
#
# Spec: docs/plans/046-mac-mini-staging-deployment.md §C2, §C3.

services:
  prefect-worker:
    # This host is a 64 GB / 14-core Mac mini, so it can afford far more than
    # the base file's conservative 8 GiB. Measured 2026-08-28: onboarding ONE
    # discharge station peaks at 4.67 GiB, and at 8 GiB the worker was
    # OOM-killed mid-hindcast (exit -9, `OOMKilled=true`) leaving a
    # half-onboarded station behind. The base limit stays 8 GiB for smaller
    # deployments; this override is the capability of THIS box.
    #
    # Docker Desktop's VM was also raised 7.65 -> 31 GiB the same day; the two
    # go together, because concurrent flow runs share the CONTAINER limit while
    # all containers share the VM. 24 GiB leaves the VM ~7 GiB for Postgres,
    # the API, Caddy and the Prefect server.
    mem_limit: 24g
    environment:
      SAPPHIRE_CONFIG_OVERLAY: /app/config/overlays/mac-mini.toml
      SAPPHIRE_REQUIRE_NWP: "1"
    volumes:
      - /Users/sapphire/camels-ch:/data/raw:ro
      - ./config/overlays/mac-mini.toml:/app/config/overlays/mac-mini.toml:ro

  prefect-worker-ingest:
    environment:
      SAPPHIRE_CONFIG_OVERLAY: /app/config/overlays/mac-mini.toml
    volumes:
      - ./config/overlays/mac-mini.toml:/app/config/overlays/mac-mini.toml:ro

  # Plan 162 D2/T6-precursor: the dedicated backup component. Binds the USB
  # SSD in place of the named `backups` volume so nightly dumps land off the
  # boot disk — mirrors the base overlay's prior prefect-worker bind, moved
  # here because the backup flow itself moved to this dedicated worker.
  # Verifying this is actually a MOUNTED volume (not a boot-disk directory)
  # is T6, deliberately deferred to Phase B.
  prefect-worker-backup:
    volumes:
      - /Volumes/sapphire-backup/pg_dumps:/data/backups:rw

  api:
    # Plan 198 T7/D2: the archive PATH is declared only in
    # config/overlays/mac-mini.toml (base config.toml has no
    # [adapters.bafu_forecast] section at all) — without this overlay the
    # quarantine gate resolves bafu_forecast_archive_path to None and the
    # Forecast Lab snapshot route reports the archive missing even with the
    # base compose file's volume correctly mounted.
    environment:
      SAPPHIRE_CONFIG_OVERLAY: /app/config/overlays/mac-mini.toml
    ports:
      - "8000:8000"
    volumes:
      - ./config/overlays/mac-mini.toml:/app/config/overlays/mac-mini.toml:ro
