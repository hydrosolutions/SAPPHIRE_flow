# First-fire register (Plan 070 §C2):
#   First successful run (any trigger):  24825587484  (2026-04-23 08:39 UTC, workflow_dispatch)
#   First successful scheduled run:      24922121174  (2026-04-25 04:02 UTC)
#   As of 2026-05-11, 17 consecutive scheduled successes 2026-04-25 → 2026-05-11.
# See docs/standards/cicd.md for the gate-parity table; do not duplicate run IDs there.
name: Integration nightly

# Runs the slow and live (external-API) integration tests excluded from
# default CI. Consolidated into one workflow per Plan 066 A5 Option 1:
# both categories share the same runner, postgres service, and DATABASE_URL,
# so keeping them separate only duplicates boilerplate.

on:
  schedule:
    # Nightly at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

# ci.yml:9-16 (fixed in commit 99e4a203): `uv.lock` carries a PRIVATE git
# dependency (aquacast, an optional extra). `uv sync --frozen` honours the
# lock and never fetches it, but a bare `uv run` re-resolves and DOES try to
# clone it — which fails with "could not read Username" on any runner
# without an aquacast token. This workflow configures only
# RECAP_DG_CLIENT_TOKEN, so every bare `uv run pytest ...` step below would
# fail before pytest even starts. Setting UV_FROZEN makes every uv
# invocation respect the lock instead of re-resolving.
env:
  UV_FROZEN: "1"

jobs:
  integration-nightly:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5  # postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sapphire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.7"
          python-version: "3.12"
      - name: Install system deps for cfgrib / rioxarray / exactextract
        # A stalled acquisition here used to eat the whole 25-minute job budget
        # and surface as a test failure. Bounding it with apt's own transport
        # knobs (Retries/Timeout) turned that into a fast, correctly-attributed
        # failure — but did NOT make it pass: on 2026-08-19 the step stalled
        # EIGHT times, in windows where the same command on a sibling runner
        # finished in ~75s. Acquire::Retries retries inside ONE apt process,
        # which keeps using the endpoint it already resolved; if that endpoint
        # is the sick one, three retries just burn the budget against it three
        # times. A FRESH apt-get process re-resolves DNS and can land somewhere
        # healthy — so the retry has to be at process level.
        #
        # Only `update` is retried this way. It writes package lists and no
        # dpkg state, so abandoning one is safe. `install` is NOT wrapped:
        # killing it mid-unpack can leave pending configuration behind, and no
        # lock file is ever deleted (locks are process-bound and released when
        # the holder dies).
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # Bypass azure.archive.ubuntu.com. The runner's sources use a
          # mirrorlist (file:/etc/apt/apt-mirrors.txt) pointing at Azure's
          # Ubuntu mirror, and on 2026-08-19 that ONE host stalled ~10 times
          # while every other repo in the same `apt-get update` — dl.google.com,
          # packages.microsoft.com — answered instantly. Retrying could never
          # fix it: a fresh process re-resolves the same hostname to the same
          # degraded service. Point at Canonical's archive instead. Slightly
          # further from the runner than a same-datacentre mirror; a few
          # seconds against ten lost runs.
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          APT_OPTS=(-o Acquire::Retries=3
                    -o Acquire::http::Timeout=30
                    -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=10 90 apt-get "${APT_OPTS[@]}" update; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::apt-get update stalled or failed on 3 separate attempts"
              exit 1
            fi
            echo "::warning::apt-get update attempt $attempt stalled; retrying in a fresh process"
            sleep 5
          done
          sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            libeccodes0 libexpat1 libgeos-c1v5
      - name: Configure git auth for the private recap-dg-client clone
        run: |
          git config --global url."https://x-access-token:${RECAP_DG_CLIENT_TOKEN}@github.com/hydrosolutions/recap-dg-client.git".insteadOf "https://github.com/hydrosolutions/recap-dg-client.git"
        env:
          RECAP_DG_CLIENT_TOKEN: ${{ secrets.RECAP_DG_CLIENT_TOKEN }}
      - run: uv sync --frozen
      # Plan 201 T3 layer 3 — the full unit suite run SEQUENTIALLY (no
      # `-n auto`). ci.yml's `unit` job runs `-n auto`, and xdist workers
      # each execute sequential CHUNKS, so a test-ordering / global-state
      # leak only surfaces there if today's partition happens to put the
      # polluter and its victim in the same worker — it does not for the
      # known Plan 201 leak, and there is no guarantee it will for the next
      # one either. This catches FUTURE, unknown leaks of the same class.
      # Nightly cadence (up to 24h to surface a new leak) is an accepted
      # cost: the harm is a misleading local `pytest tests/unit/` signal,
      # not broken production, and running this on every push (~86/week,
      # only 18 of them PR merges) was measured at ~43 CI-hours/week and
      # rejected. No `-n auto`/`--cov` here: this step's only job is
      # ordering, not coverage or speed, and coverage already runs in
      # ci.yml's `unit` job on every push.
      #
      # Ratified scope note (fixer round, 2026-08-28): this plain `uv sync
      # --frozen` does NOT install the `aquacast` extra, so
      # `tests/unit/models/test_aquacast_shim.py` skips via importorskip
      # here — this step is NOT the "full unit suite" in the sense of every
      # test executing; it is the full suite in COLLECTION order, which is
      # all T3 layer 3 needs to catch an ordering/global-state leak. Real
      # `aquacast` coverage (installing the extra, proving the shim test
      # ran) is already `ci.yml`'s `unit` job's responsibility, on every
      # push; wiring the
      # aquacast credential into this workflow too would be an unrelated
      # expansion of a plan whose own proportionality constraint rules that
      # out (see docs/plans/201-unit-suite-isolation-defect.md).
      - run: uv run pytest tests/unit/ -q
      # Run both the slow-marked tests from the main integration tree and
       # every test under tests/integration/live (path-based, so we don't
       # depend on any particular `live*` marker name staying consistent).
      - run: uv run pytest tests/integration/ -v -m "slow" --timeout=3600
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sapphire_test
      # Path-based selection under tests/integration/live/ — override the
      # default addopts marker exclusion (which strips live/live_lindas/
      # live_stac) so every test under that directory runs regardless of
      # which live* marker it carries.
      - run: uv run pytest tests/integration/live -v --timeout=3600 --override-ini "addopts="
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sapphire_test
