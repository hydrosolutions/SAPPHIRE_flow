name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Plan 159 follow-up. `uv.lock` carries a PRIVATE git dependency (aquacast, an
# optional extra). `uv sync --frozen` honours the lock and never fetches it, but a
# bare `uv run` re-resolves and DOES try to clone it — which fails with
# "could not read Username" on any runner without an aquacast token. Setting
# UV_FROZEN makes every uv invocation respect the lock, so CI needs no aquacast
# credential unless it actually installs the extra.
env:
  UV_FROZEN: "1"

# A new push to a PR branch makes the in-flight run obsolete: nobody reads the
# result of a run against a commit that is no longer the head. Cancel it and
# free the runner. NOT applied to `main` — every commit that lands there is a
# distinct state someone may need a verdict on, and cancelling would leave
# gaps in the record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    # 20: the step bounds below sum to 16 (Plan 309 T2), so 10 could not hold
    # them. The job runs in ~55s; this bounds the worst case, not the normal one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 3  # git fetch from github.com (~3s observed)
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        timeout-minutes: 3  # downloads the uv binary (~6s observed)
        with:
          version: "0.11.7"
          python-version: "3.12"
      # recap-dg-client is a private repo (Plan 082 Task 2H) — every job that
      # runs `uv sync` clones it, so git needs authenticated HTTPS access.
      # Scoped via insteadOf to ONLY this repo URL.
      - name: Configure git auth for the private clones
        run: |
          git config --global url."https://x-access-token:${RECAP_DG_CLIENT_TOKEN}@github.com/hydrosolutions/recap-dg-client.git".insteadOf "https://github.com/hydrosolutions/recap-dg-client.git"
          # aquacast (Plan 159) is only reachable when the secret is set. Guarded so
          # the rewrite is never written with an EMPTY token: an empty credential
          # turns a would-be 404 into a confusing auth failure, and CI does not
          # install the `aquacast` extra by default anyway.
          if [ -n "${AQUACAST_TOKEN}" ]; then
            git config --global url."https://x-access-token:${AQUACAST_TOKEN}@github.com/hydrosolutions/aquacast.git".insteadOf "https://github.com/hydrosolutions/aquacast.git"
          fi
        env:
          RECAP_DG_CLIENT_TOKEN: ${{ secrets.RECAP_DG_CLIENT_TOKEN }}
          AQUACAST_TOKEN: ${{ secrets.AQUACAST_TOKEN }}
      - run: uv sync --frozen
        timeout-minutes: 5  # PyPI + two private git repos
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      # -x: follow `source` (Plan 199 T2 — docker-endpoint.sh is sourced by
      # four wrappers below; plain shellcheck flags the `source` line as
      # SC1091). Plan 199 also adds prune-docker.sh, run-nepal-forcing.sh
      # and docker-endpoint.sh itself, previously omitted from this list.
      - run: shellcheck -x scripts/launchd/start-sapphire.sh scripts/launchd/watchdog.sh scripts/launchd/install-launchd.sh scripts/launchd/run-recap-probe.sh scripts/launchd/prune-docker.sh scripts/launchd/run-nepal-forcing.sh scripts/launchd/docker-endpoint.sh scripts/bootstrap-mac-mini.sh
      - run: uv run pyright --outputjson src/ > /tmp/pyright.json || true
      - run: uv run python tools/pyright_ratchet.py /tmp/pyright.json tools/pyright_baseline.json
      # A2 — Trivy filesystem scan. Reads uv.lock + pyproject.toml without
      # building the image, so dep-only PRs get fast feedback. Fails on HIGH
      # or CRITICAL vulnerabilities that have an available fix; unfixed CVEs
      # are ignored to avoid blocking on upstream work we cannot action.
      # Known-accepted CVEs live in .trivyignore with dated comments.
      # `skip-dirs: .venv` because `uv sync` ran earlier in this job and
      # trivy would otherwise descend into Prefect's bundled JS UI assets
      # (lodash, vega, ...) — those live inside an installed package and
      # are the image-scan tier's responsibility, not the fs-scan tier's.
      # Equivalent CLI: trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --skip-dirs .venv .
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        # 5: a step bound must stay strictly below its job's (now 20), or the job
        # cancels at the same instant and skips any explanation. The job runs in
        # ~55s, so this bounds the worst case rather than the normal one.
        timeout-minutes: 5  # downloads the trivy binary AND the vulnerability DB
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          skip-dirs: .venv
          cache: "true"

  unit:
    runs-on: ubuntu-latest
    # Plan 319 — one leg per shard, each on its own runner. `-n auto` (Plan 300)
    # already used every core of ONE runner; `ubuntu-latest` gives 2-4 of them
    # against 12 on a developer machine, which is why the same suite took 12-13
    # minutes here and under 3 locally. More parallelism inside one runner
    # cannot close that gap; more runners can.
    #
    # The shard IDs are the source of truth in tools/unit_shards.py, which also
    # derives each leg's pytest arguments — no test path is repeated in this
    # file. tests/unit/tools/test_unit_shards.py proves, by collected node id,
    # that the legs partition the suite exactly. The hazard it defends against
    # is a test in NO shard: it runs nowhere, and nothing fails.
    strategy:
      # Every shard's verdict is wanted: cancelling the other three on the first
      # red would hide whether a failure is local to one shard.
      fail-fast: false
      matrix:
        shard: [scripts, services, adapters-flows, rest]
    # Plan 185 D6 — pinned exactly. Specifying ANY permissions block zeroes the
    # unspecified ones, so contents: read must be restated here or checkout
    # breaks; pull-requests: read is new, for the `gh api` lock-change check
    # below.
    permissions: { contents: read, pull-requests: read }
    # 30, not 25: the bounded steps below sum to 27 as written, though only 22
    # are EXECUTABLE together — the two `Install (...)` variants are mutually
    # exclusive (Plan 309 T2 added the `gh api` bound). The job's own pytest step
    # is unbounded; before Plan 319 it took ~11 minutes and a shard of it takes a
    # fraction of that. Left at 30 rather than tightened: the headroom bounds a
    # hung fetch plus a normal test run, and sharding makes the setup steps above
    # no faster — each of the four legs pays them in full.
    timeout-minutes: 30
    env:
      # Plan 185 D2 — read once at job level: a step-level `if:` cannot
      # reference `secrets.*` directly, but it CAN read the `env` context,
      # which a job-level `env:` can populate from a secret.
      AQUACAST_TOKEN_PRESENT: ${{ secrets.AQUACAST_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 3  # git fetch from github.com (~3s observed)
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        timeout-minutes: 3  # downloads the uv binary (~6s observed)
        with:
          version: "0.11.7"
          python-version: "3.12"
      - name: Install system deps for cfgrib / rioxarray / exactextract
        # A stalled acquisition here used to eat the whole 25-minute job budget
        # and surface as a test failure. Bounding it with apt's own transport
        # knobs (Retries/Timeout) turned that into a fast, correctly-attributed
        # failure — but did NOT make it pass: on 2026-08-19 the step stalled
        # EIGHT times, in windows where the same command on a sibling runner
        # finished in ~75s. Acquire::Retries retries inside ONE apt process,
        # which keeps using the endpoint it already resolved; if that endpoint
        # is the sick one, three retries just burn the budget against it three
        # times. A FRESH apt-get process re-resolves DNS and can land somewhere
        # healthy — so the retry has to be at process level.
        #
        # Only `update` is retried this way. It writes package lists and no
        # dpkg state, so abandoning one is safe. `install` is NOT wrapped:
        # killing it mid-unpack can leave pending configuration behind, and no
        # lock file is ever deleted (locks are process-bound and released when
        # the holder dies).
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # Bypass azure.archive.ubuntu.com. The runner's sources use a
          # mirrorlist (file:/etc/apt/apt-mirrors.txt) pointing at Azure's
          # Ubuntu mirror, and on 2026-08-19 that ONE host stalled ~10 times
          # while every other repo in the same `apt-get update` — dl.google.com,
          # packages.microsoft.com — answered instantly. Retrying could never
          # fix it: a fresh process re-resolves the same hostname to the same
          # degraded service. Point at Canonical's archive instead. Slightly
          # further from the runner than a same-datacentre mirror; a few
          # seconds against ten lost runs.
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          APT_OPTS=(-o Acquire::Retries=3
                    -o Acquire::http::Timeout=30
                    -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=10 90 apt-get "${APT_OPTS[@]}" update; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::apt-get update stalled or failed on 3 separate attempts"
              exit 1
            fi
            echo "::warning::apt-get update attempt $attempt stalled; retrying in a fresh process"
            sleep 5
          done
          sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            libeccodes0 libexpat1 libgeos-c1v5
      - name: Configure git auth for the private clones
        run: |
          git config --global url."https://x-access-token:${RECAP_DG_CLIENT_TOKEN}@github.com/hydrosolutions/recap-dg-client.git".insteadOf "https://github.com/hydrosolutions/recap-dg-client.git"
          # aquacast (Plan 159) is only reachable when the secret is set. Guarded so
          # the rewrite is never written with an EMPTY token: an empty credential
          # turns a would-be 404 into a confusing auth failure. The `unit` job DOES
          # install the `aquacast` extra by default whenever the token reaches this
          # run — see the AQUACAST_TOKEN_PRESENT-gated install steps below.
          if [ -n "${AQUACAST_TOKEN}" ]; then
            git config --global url."https://x-access-token:${AQUACAST_TOKEN}@github.com/hydrosolutions/aquacast.git".insteadOf "https://github.com/hydrosolutions/aquacast.git"
          fi
        env:
          RECAP_DG_CLIENT_TOKEN: ${{ secrets.RECAP_DG_CLIENT_TOKEN }}
          AQUACAST_TOKEN: ${{ secrets.AQUACAST_TOKEN }}
      # Plan 185 — GitHub withholds the Actions-store copy of a secret from
      # runs it attributes to Dependabot; a same-named secret in the
      # separate Dependabot store is substituted in instead (see
      # docs/standards/cicd.md). AQUACAST_TOKEN is mirrored into both stores,
      # so AQUACAST_TOKEN_PRESENT is normally true even on those runs — this
      # guard exists for when it ISN'T: a new private dependency's secret not
      # yet mirrored into the Dependabot store, or either copy deleted or
      # misconfigured. That attribution is keyed on
      # `github.actor` — the identity that triggered THIS run — not on the
      # PR's author: a maintainer can push a further commit onto a
      # Dependabot-opened branch, and that push (and the `pull_request`
      # `synchronize` event it fires) runs as the maintainer, with secrets
      # restored. Checking `github.event.pull_request.user.login` instead
      # would still read "dependabot[bot]" for that human-triggered run and
      # misclassify a real missing-credential failure as an expected
      # degrade. Detect whether THIS PR touches uv.lock — the one case
      # where the extra's resolution can actually change (D1 case 3) — so
      # the steps below can tell "safe to degrade" apart from "must fail".
      # Guarded to the one case that needs it: never consulted on `push`,
      # where the token is present anyway (case 1) and
      # `github.event.pull_request.number` would be empty, which `gh`
      # treats as "no selector" and falls back to guessing a PR from the
      # branch.
      - name: Detect uv.lock change (Dependabot degraded-coverage guard)
        timeout-minutes: 3  # two `gh api` calls against the GitHub REST API
        if: >-
          env.AQUACAST_TOKEN_PRESENT != 'true' &&
          github.event_name == 'pull_request' &&
          github.actor == 'dependabot[bot]'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # `--paginate` does not lift the pull-request-files endpoint's own
          # hard 3000-file cap: past that many changed files the response is
          # silently incomplete no matter how many pages are fetched, so a
          # uv.lock touch outside the returned set would read as "no change".
          # Read the PR's own changed_files count first and fail closed (as
          # if uv.lock changed) rather than trust a listing that might be cut
          # short.
          count=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.changed_files') || count=""
          # Reject empty AND non-numeric: `[ "$count" -gt 3000 ]` exits 2 on a
          # non-number, and `bash -e` does NOT abort on a failed `elif` CONDITION,
          # so a malformed count (jq yields "null" when the field is absent) would
          # fall through to the listing and could set UV_LOCK_CHANGED=false.
          if ! [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read this PR's changed-file count via gh (got '${count}'); failing closed (treating as if uv.lock changed)."
            echo "UV_LOCK_CHANGED=true" >> "$GITHUB_ENV"
          elif [ "$count" -gt 3000 ]; then
            echo "::error::This PR touches $count files, past the pull-request-files API's 3000-file hard cap; the file listing could be incomplete. Failing closed (treating as if uv.lock changed)."
            echo "UV_LOCK_CHANGED=true" >> "$GITHUB_ENV"
          elif gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/pr-files.txt"; then
            if grep -qxF 'uv.lock' "$RUNNER_TEMP/pr-files.txt"; then
              echo "UV_LOCK_CHANGED=true" >> "$GITHUB_ENV"
            else
              echo "UV_LOCK_CHANGED=false" >> "$GITHUB_ENV"
            fi
          else
            # Capture the command's success BEFORE testing its output: an API
            # failure must fail closed, never read as "no lock change".
            echo "::error::Could not read this PR's changed files via gh; failing closed (treating as if uv.lock changed)."
            echo "UV_LOCK_CHANGED=true" >> "$GITHUB_ENV"
          fi
      # D1 case 3 — token absent, and NOT the one case (Dependabot-actor
      # run, uv.lock untouched) that is allowed to degrade instead. Covers
      # both "the secret was deleted/misconfigured" and "this PR changes
      # uv.lock", which is where the extra's resolution is most likely to
      # actually break (OD-2).
      - name: AQUACAST_TOKEN absent — fail
        if: >-
          env.AQUACAST_TOKEN_PRESENT != 'true' &&
          !(github.event_name == 'pull_request' &&
            github.actor == 'dependabot[bot]' &&
            env.UV_LOCK_CHANGED == 'false')
        run: |
          echo "::error::AQUACAST_TOKEN is not available to this run. GitHub structurally withholds Actions secrets from runs it attributes to Dependabot, so this may be expected — but a deleted/misconfigured secret looks identical, and a PR that changes uv.lock cannot skip the extra either way. Mirror AQUACAST_TOKEN into BOTH the Actions and Dependabot secret stores (Settings > Secrets and variables), matching RECAP_DG_CLIENT_TOKEN."
          exit 1
      # `--extra aquacast` ONLY here (owner, 2026-08-18), and only when the
      # token actually reached this run (Plan 185 D1 case 1) — otherwise the
      # shim's tests skip via importorskip and the aquacast boundary is
      # exercised on nobody's machine but the author's, a weak position for
      # code that will feed operational forecasts. It costs a torch download
      # on this one job; every other job stays on the plain sync.
      - name: Install (aquacast extra)
        if: env.AQUACAST_TOKEN_PRESENT == 'true'
        run: uv sync --frozen --extra aquacast
        timeout-minutes: 5  # PyPI + two private git repos
      # D1 case 2 / D3 — token absent, Dependabot-actor run, uv.lock
      # untouched: degrade loudly instead of failing red. The plain sync
      # still runs everything else in tests/unit/; only the aquacast shim's
      # own tests (behind importorskip) lose coverage on this run.
      - name: Install (no aquacast extra — degraded)
        timeout-minutes: 5  # PyPI + two private git repos
        if: >-
          env.AQUACAST_TOKEN_PRESENT != 'true' &&
          github.event_name == 'pull_request' &&
          github.actor == 'dependabot[bot]' &&
          env.UV_LOCK_CHANGED == 'false'
        run: |
          uv sync --frozen
          echo "::warning::AQUACAST_TOKEN is not available to this Dependabot-triggered run (GitHub withholds Actions secrets from Dependabot by design). Installed WITHOUT the aquacast extra — tests/unit/models/test_aquacast_shim.py is skipped via importorskip, so aquacast-shim coverage did not run for this PR."
      # D4 — exit status alone is not sufficient: verified locally, without
      # the extra this exact node reports a collector error plus "1 skipped"
      # and still exits non-zero. Assert on pytest's own summary line so the
      # installed case PROVES the shim test ran, not just that the process
      # didn't crash. Because exactly one node is requested, no other test
      # can satisfy the grep.
      #
      # Plan 319 deliberately did NOT pin this to one matrix leg: each leg is a
      # separate runner with its own install, so the proof is worth having on
      # each. Its `if:` is the safety property Plan 185 D1 case 1 tests by full
      # string — leave it alone.
      - name: Prove the aquacast shim test ran
        if: env.AQUACAST_TOKEN_PRESENT == 'true'
        run: |
          set -o pipefail
          uv run pytest 'tests/unit/models/test_aquacast_shim.py::TestRealDiscovery::test_discover_models_returns_the_aquacast_model' -q --color=no | tee "$RUNNER_TEMP/aquacast-shim.txt"
          grep -Fq '1 passed' "$RUNNER_TEMP/aquacast-shim.txt"
      # Plan 201 T3 layer 2 — `-n auto` below hides ordering/state-leak
      # defects: xdist workers each run sequential chunks, so a polluter and
      # its victim only collide if today's partition happens to put them in
      # the same worker. This targeted check locks the ONE known 3-way
      # interaction found on 2026-08-27 (test_export_forecast_lab.py's
      # main() sets structlog's global cache_logger_on_first_use=True,
      # test_compute_skills.py is the first to bind and thus permanently
      # cache the skill-service module logger while that flag is live, and
      # test_combined_skill.py's capture_logs() then silently observes `[]`)
      # at ~8s cost on every push/PR. It is a canary, not the defence — T2
      # (the autouse structlog reset in tests/conftest.py) is the actual
      # fix; layer 3 (the nightly full sequential run) is what catches
      # future, unknown leaks of this class.
      # D4-style proof (fixer round, 2026-08-28): `grep -Eq '^[0-9]+ passed'`
      # alone only proves SOME test in the run passed — if the victim node
      # (test_coverage_log_message, the one that actually observed the
      # Plan 201 leak) is later deleted, marked skip, or deselected, the
      # other 27 tests in these four files still print a matching "N passed"
      # line and this gate stays green while catching nothing. Run with `-v`
      # and assert the EXACT victim node ID reports PASSED, plus that
      # nothing in the run failed, errored, or was skipped — a disappearing
      # victim then shows up as a missing PASSED line, not a silently
      # shrinking count.
      #
      # Plan 319 — UNSHARDED and pinned to one matrix leg. This check owns its
      # own four files in a fixed order; splitting them across legs would
      # destroy the very ordering it exists to exercise, and repeating it on
      # every leg would run the same sequential probe four times. It stays
      # exactly as it was: one place, one run, the same exact node id asserted.
      - name: Plan 201 regression — known ordering leak stays fixed (sequential)
        if: matrix.shard == 'scripts'
        run: |
          set -o pipefail
          uv run pytest -v \
            tests/unit/cli/test_export_forecast_lab.py \
            tests/unit/flows/test_compute_skills.py \
            tests/unit/scripts/test_backfill_meteoswiss_history_script.py \
            tests/unit/services/skill/test_combined_skill.py \
            | tee "$RUNNER_TEMP/plan201-sequential.txt"
          grep -Fq 'tests/unit/services/skill/test_combined_skill.py::TestCoverageLogging::test_coverage_log_message PASSED' "$RUNNER_TEMP/plan201-sequential.txt"
          ! grep -Eq '^[0-9]+ (failed|error)' "$RUNNER_TEMP/plan201-sequential.txt"
          ! grep -q ' skipped' "$RUNNER_TEMP/plan201-sequential.txt"
      # -n auto STAYS, inside every shard (Plan 300, and Plan 319's Out-list):
      # the shards ADD runners, they do not replace in-runner parallelism.
      # Verified parallel-safe on 2026-08-18 and re-isolated per xdist worker by
      # Plan 300. No `-v`: thousands of PASSED lines nobody reads on a green run
      # that bury the failure on a red one.
      #
      # The scope comes from tools/unit_shards.py, never from a path written
      # here — the `rest` shard is COMPUTED as "everything the named groups are
      # not", so a new tests/unit subdirectory, or a test file added directly in
      # tests/unit/, lands in a shard by construction instead of silently
      # running nowhere.
      #
      # Coverage (Plan 319 D2a): each leg only WRITES its data file —
      # `--cov-report=` suppresses the per-shard report, because four partial
      # percentages that each look like a regression against the old whole-suite
      # number is exactly what D2 rejected. The `unit-coverage` job below
      # stitches the four back into the one number. It stays INFORMATIONAL:
      # there is no --cov-fail-under here or in pyproject.toml, and adding one
      # is a different decision.
      - name: Run unit shard
        env:
          COVERAGE_FILE: ${{ github.workspace }}/coverage-data/shard.${{ matrix.shard }}.coverage
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$COVERAGE_FILE")"
          args="$(uv run python tools/unit_shards.py --pytest-args '${{ matrix.shard }}')"
          echo "shard ${{ matrix.shard }}: pytest $args"
          started=$SECONDS
          # Word-splitting $args is deliberate — it is an argument list.
          # shellcheck disable=SC2086
          uv run pytest $args -n auto --cov=src/sapphire_flow --cov-report=
          # Plan 319 D1 balanced the shards on COLLECTED COUNTS, which are a
          # proxy for duration and not a good one. This line is how that proxy
          # gets checked against reality; if the legs come out lopsided, the
          # answer is a duration-based split (D1 option b).
          echo "::notice title=unit shard ${{ matrix.shard }}::wall-clock $((SECONDS - started))s"
      - name: Upload this shard's coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        timeout-minutes: 3  # uploads to the Actions artifact store (~2s observed)
        with:
          name: unit-coverage-${{ matrix.shard }}
          path: coverage-data/shard.${{ matrix.shard }}.coverage
          # error, not warn: a missing fraction would silently understate the
          # combined number rather than fail, which is the same silence this
          # plan exists to remove.
          if-no-files-found: error

  # Plan 319 D2a — the shards each see a fraction of the source; this job
  # stitches their four coverage data files back into the single whole-suite
  # number a PR reader has always had. Informational, exactly as before: no
  # threshold is introduced here (see the shard step above).
  #
  # Needs no apt packages and no aquacast extra: `coverage report` reads data
  # files and source text, it imports nothing from the project.
  unit-coverage:
    runs-on: ubuntu-latest
    needs: unit
    permissions: { contents: read }
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 3  # git fetch from github.com (~3s observed)
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        timeout-minutes: 3  # downloads the uv binary (~6s observed)
        with:
          version: "0.11.7"
          python-version: "3.12"
      # recap-dg-client is a private repo (Plan 082 Task 2H) — every job that
      # runs `uv sync` clones it, so git needs authenticated HTTPS access.
      # Scoped via insteadOf to ONLY this repo URL.
      - name: Configure git auth for the private clones
        run: |
          git config --global url."https://x-access-token:${RECAP_DG_CLIENT_TOKEN}@github.com/hydrosolutions/recap-dg-client.git".insteadOf "https://github.com/hydrosolutions/recap-dg-client.git"
          # aquacast (Plan 159) is only reachable when the secret is set. Guarded so
          # the rewrite is never written with an EMPTY token: an empty credential
          # turns a would-be 404 into a confusing auth failure, and this job does
          # not install the `aquacast` extra.
          if [ -n "${AQUACAST_TOKEN}" ]; then
            git config --global url."https://x-access-token:${AQUACAST_TOKEN}@github.com/hydrosolutions/aquacast.git".insteadOf "https://github.com/hydrosolutions/aquacast.git"
          fi
        env:
          RECAP_DG_CLIENT_TOKEN: ${{ secrets.RECAP_DG_CLIENT_TOKEN }}
          AQUACAST_TOKEN: ${{ secrets.AQUACAST_TOKEN }}
      - run: uv sync --frozen
        timeout-minutes: 5  # PyPI + two private git repos
      - name: Download every shard's coverage data
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        timeout-minutes: 3  # reads from the Actions artifact store
        with:
          pattern: unit-coverage-*
          merge-multiple: true
          path: coverage-data
      - name: Combine the shards into one whole-suite number
        run: |
          set -euo pipefail
          # One data file per shard, named by shard, so a missing leg is visible
          # here rather than silently lowering the combined percentage.
          ls -1 coverage-data/
          uv run coverage combine coverage-data/shard.*.coverage
          uv run coverage report --show-missing

  # A4 — Wheel-only guard for dependency-update installs.
  #
  # Step 1 below is the wheel-only guard: it runs `uv sync --frozen
  # --no-build --no-cache --no-install-project --no-install-package
  # forecastinterface` on GitHub-hosted amd64 to make CI the first execution
  # environment for new dependency versions and to fail if any non-excepted
  # package introduces new Python build-backend / sdist source execution on
  # this platform. `--no-cache` is required because cached pre-built wheels
  # would otherwise mask a newly-required source build. `--no-install-project`
  # skips the local editable root package (which has no binary distribution
  # by design) so the guard only checks third-party dependencies — the actual
  # target of this control.
  #
  # Runs on every PR and push; the guard is fast enough that scoping to
  # pyproject.toml / uv.lock changes is not necessary. Any merged
  # dependency change is therefore guaranteed to have exercised the guard.
  #
  # Known source-build exceptions: `forecastinterface` is the temporary CI
  # exception and is installed only after step 1 succeeds; `exactextract` may
  # require a source build in the linux/arm64 Docker builder path.
  # `recap-dg-client` (Plan 082 Task 2H) is a second temporary git-pin
  # exception, same shape as forecastinterface — Nepal v1 recap Gateway
  # client, no published wheel index. Removal trigger: once
  # `recap-dg-client` is published to the hydrosolutions private package
  # index and CI/Docker can install it as a wheel with no source build,
  # drop this exception (tracked as an IT-specialist Plan 080-style
  # follow-up). Any new exception must be documented in
  # docs/standards/security.md per Plan 064 A4 step 3.
  wheel-only-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 3  # git fetch from github.com (~3s observed)
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        timeout-minutes: 3  # downloads the uv binary (~6s observed)
        with:
          version: "0.11.7"
          python-version: "3.12"
          # Disable setup-uv's cache feature in this job: the wheel-only
          # guard uses `uv sync --no-cache`, so no cache directory is
          # populated. setup-uv v8+ errors on missing cache at post-run;
          # explicitly disabling here makes the job v4/v8 compatible
          # (Dependabot PR #4 surfaced this).
          enable-cache: false
      # recap-dg-client is a PRIVATE repo (hydrosolutions/recap-dg-client) —
      # both wheel-guard steps below clone it, so git needs authenticated
      # HTTPS access before either `uv sync` runs. Scoped via insteadOf to
      # ONLY this repo URL (never a blanket github.com credential rewrite).
      - name: Configure git auth for the private clones
        run: |
          git config --global url."https://x-access-token:${RECAP_DG_CLIENT_TOKEN}@github.com/hydrosolutions/recap-dg-client.git".insteadOf "https://github.com/hydrosolutions/recap-dg-client.git"
          # aquacast (Plan 159) is only reachable when the secret is set. Guarded so
          # the rewrite is never written with an EMPTY token: an empty credential
          # turns a would-be 404 into a confusing auth failure, and CI does not
          # install the `aquacast` extra by default anyway.
          if [ -n "${AQUACAST_TOKEN}" ]; then
            git config --global url."https://x-access-token:${AQUACAST_TOKEN}@github.com/hydrosolutions/aquacast.git".insteadOf "https://github.com/hydrosolutions/aquacast.git"
          fi
        env:
          RECAP_DG_CLIENT_TOKEN: ${{ secrets.RECAP_DG_CLIENT_TOKEN }}
          AQUACAST_TOKEN: ${{ secrets.AQUACAST_TOKEN }}
      - timeout-minutes: 5  # PyPI + two private git repos
        run: |
          set -euo pipefail
          # step 1 IS the guard — must keep --no-build and must precede step 2; step 2 has no --no-build and may build ONLY the excepted packages.
          uv sync --frozen --no-build --no-cache --no-install-project --no-install-package forecastinterface --no-install-package recap-dg-client
          uv sync --frozen --no-cache --no-install-project --reinstall-package forecastinterface --reinstall-package recap-dg-client

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5  # postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sapphire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 3  # git fetch from github.com (~3s observed)
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        timeout-minutes: 3  # downloads the uv binary (~6s observed)
        with:
          version: "0.11.7"
          python-version: "3.12"
      - name: Install system deps for cfgrib / rioxarray / exactextract
        # A stalled acquisition here used to eat the whole 25-minute job budget
        # and surface as a test failure. Bounding it with apt's own transport
        # knobs (Retries/Timeout) turned that into a fast, correctly-attributed
        # failure — but did NOT make it pass: on 2026-08-19 the step stalled
        # EIGHT times, in windows where the same command on a sibling runner
        # finished in ~75s. Acquire::Retries retries inside ONE apt process,
        # which keeps using the endpoint it already resolved; if that endpoint
        # is the sick one, three retries just burn the budget against it three
        # times. A FRESH apt-get process re-resolves DNS and can land somewhere
        # healthy — so the retry has to be at process level.
        #
        # Only `update` is retried this way. It writes package lists and no
        # dpkg state, so abandoning one is safe. `install` is NOT wrapped:
        # killing it mid-unpack can leave pending configuration behind, and no
        # lock file is ever deleted (locks are process-bound and released when
        # the holder dies).
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # Bypass azure.archive.ubuntu.com. The runner's sources use a
          # mirrorlist (file:/etc/apt/apt-mirrors.txt) pointing at Azure's
          # Ubuntu mirror, and on 2026-08-19 that ONE host stalled ~10 times
          # while every other repo in the same `apt-get update` — dl.google.com,
          # packages.microsoft.com — answered instantly. Retrying could never
          # fix it: a fresh process re-resolves the same hostname to the same
          # degraded service. Point at Canonical's archive instead. Slightly
          # further from the runner than a same-datacentre mirror; a few
          # seconds against ten lost runs.
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          APT_OPTS=(-o Acquire::Retries=3
                    -o Acquire::http::Timeout=30
                    -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=10 90 apt-get "${APT_OPTS[@]}" update; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::apt-get update stalled or failed on 3 separate attempts"
              exit 1
            fi
            echo "::warning::apt-get update attempt $attempt stalled; retrying in a fresh process"
            sleep 5
          done
          sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            libeccodes0 libexpat1 libgeos-c1v5
      - name: Configure git auth for the private clones
        run: |
          git config --global url."https://x-access-token:${RECAP_DG_CLIENT_TOKEN}@github.com/hydrosolutions/recap-dg-client.git".insteadOf "https://github.com/hydrosolutions/recap-dg-client.git"
          # aquacast (Plan 159) is only reachable when the secret is set. Guarded so
          # the rewrite is never written with an EMPTY token: an empty credential
          # turns a would-be 404 into a confusing auth failure, and CI does not
          # install the `aquacast` extra by default anyway.
          if [ -n "${AQUACAST_TOKEN}" ]; then
            git config --global url."https://x-access-token:${AQUACAST_TOKEN}@github.com/hydrosolutions/aquacast.git".insteadOf "https://github.com/hydrosolutions/aquacast.git"
          fi
        env:
          RECAP_DG_CLIENT_TOKEN: ${{ secrets.RECAP_DG_CLIENT_TOKEN }}
          AQUACAST_TOKEN: ${{ secrets.AQUACAST_TOKEN }}
      - run: uv sync --frozen
        timeout-minutes: 5  # PyPI + two private git repos
      - run: uv run pytest tests/integration/ --ignore=tests/integration/live -v -m "not slow"
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sapphire_test

  # B0 + B3 + B4 — Build the app image in CI and scan it in the same job.
  #
  # Why one job: GitHub-hosted jobs run on fresh VMs. A local docker image
  # built in one job is NOT available in another job. So build, trivy image,
  # and syft must share a runner context (or an image tarball must be
  # explicitly uploaded as an artifact and re-loaded). We keep all three
  # steps in this single job for simplicity.
  #
  # The e2e job gates on this job succeeding (see `needs:` below).
  build-image-and-scan:
    runs-on: ubuntu-latest
    # 60: the BOUNDED steps alone sum to 47 minutes plus 10 of retry sleeps, so 30
    # could not hold this job's own retries and would cancel mid-chain, skipping
    # the enforcement steps that exist to explain the failure (independent review
    # 2026-09-22, medium). Runner minutes are free on a public repo, so the only
    # cost is feedback latency on a genuinely hung job — which today burns 30
    # minutes and then says nothing at all.
    #
    # ⛔ This raises a CEILING; it does not GUARANTEE that enforcement is reached.
    # Several substantial steps here are deliberately unbounded (the image smoke
    # check, both `trivy convert` calls), so a hang in one of those still consumes
    # the whole budget, and no ceiling fixes that.
    #
    # ⚠️ **Plan 310 does not close this either.** It adds elapsed-time admission
    # before the SBOM RETRY WAITS specifically, and its scope explicitly excludes
    # Trivy — so it addresses retry-budget exhaustion, not a hang in an unbounded
    # step. *(Independent review 2026-09-22 caught this pointer overstating what
    # 310 covers.)* Bounding those steps, or admitting on elapsed time more
    # broadly, would be its own piece of work.
    timeout-minutes: 60
    # security-events: write is required by github/codeql-action/upload-sarif
    # (T2, Plan 180). contents: read is the checkout minimum. Declared
    # explicitly rather than relying on the repo's ambient
    # default-workflow-permissions setting, which is a per-repo config that
    # can change independently of this file.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 3  # git fetch from github.com (~3s observed)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        timeout-minutes: 3  # downloads the buildx plugin
      # B0 — Build the image and load it into the local docker daemon so the
      # later trivy and syft steps in this same job can reference the tag.
      - name: Build app image
        id: build-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        timeout-minutes: 8  # Docker Hub base images + uv sync inside; 124s observed
        with:
          context: .
          file: ./Dockerfile
          tags: sapphire-flow:ci-${{ github.sha }}
          load: true
          push: false
          # recap-dg-client is a private repo (Plan 082 Task 2H) — the
          # builder stage's `uv sync` clones it via a BuildKit secret mount
          # (Dockerfile), never baked into an image layer.
          secrets: |
            recap_dg_client_token=${{ secrets.RECAP_DG_CLIENT_TOKEN }}
      # Plan 218 fixer round — smoke-check the curated operator scripts (D2)
      # actually land at /app/scripts in the BUILT image, not just in the
      # Dockerfile text (tests/unit/deploy/test_dockerfile_operator_scripts.py
      # covers the text). This is the default (WITH_AQUACAST=0) image and only
      # proves the files are present and importable enough for argparse to
      # reach --help — it does NOT prove model resolution
      # (resolve_required_static_names()/cmal_pool_pt), which needs a second
      # WITH_AQUACAST=1 build with the aquacast_token secret. That check is
      # deliberately left to a manual/mac-mini run — see
      # docs/plans/218-ship-operator-scripts-in-the-image.md § Exit gates.
      - name: Smoke-check operator scripts in the built image
        if: ${{ steps.build-image.outcome == 'success' }}
        run: |
          set -euo pipefail
          shipped=$(docker run --rm --entrypoint sh "sapphire-flow:ci-${{ github.sha }}" -c 'ls /app/scripts' | sort)
          # Plan 218's curated list. ⚠️ FIFTH copy — the others are the Dockerfile
          # COPY, tests/unit/deploy/test_dockerfile_operator_scripts.py, and the two
          # documents that quote it. That test now reads THIS list too, so a new
          # script cannot pass locally and fail here (Plan 262 T3a).
          expected=$(printf '%s\n' \
            backfill_era5_land_history.py \
            backfill_meteoswiss_history.py \
            create_station_group.py \
            import_caravan_attributes.py \
            onboard.py \
            validate_forcing_reference.py | sort)
          if [ "$shipped" != "$expected" ]; then
            echo "::error::/app/scripts contents do not match the curated list"
            echo "expected:"; echo "$expected"
            echo "found:"; echo "$shipped"
            exit 1
          fi
          for script in $expected; do
            docker run --rm --entrypoint sh "sapphire-flow:ci-${{ github.sha }}" \
              -c "python /app/scripts/$script --help" >/dev/null
          done
      # B3 — Trivy image scan, restructured (Plan 180) into scan-once/derive-many so a
      # failure explains itself instead of printing a bare `exit code 1` (the
      # 2026-08-17 incident: `format: sarif` + file `output:` prints nothing to the log):
      #
      #   scan (JSON, non-gating) -> convert --format table (the gate, printed to the log)
      #                           -> convert --format sarif (code-scanning upload, T2)
      #
      # Deriving both outputs from the SAME trivy-image.json means the printed table and
      # the SARIF are provably the same data as what failed the gate — re-scanning on the
      # failure path instead could disagree with the run that actually gated (a different
      # advisory-DB state).
      #
      # Step 1 — scan to JSON. exit-code is explicitly "0": this step is non-gating for
      # *findings* (the convert step below is the gate) but still fails closed on a real
      # operational error (DB fetch, render, setup failure), per trivy-action's normal
      # exit-code semantics — GitHub's implicit success() then correctly skips every step
      # after it, including the gate. ignore-unfixed stays true and lives HERE: `trivy
      # convert` has no --ignore-unfixed flag, so it can only be applied at scan time —
      # verified empirically (Plan 180 T1), not assumed. Covers OS-level layers the fs
      # scan (A2) does not see.
      # Plan 309 T2 (ii): retried, and ONLY this scan. Its `exit-code: "0"` means it
      # CANNOT fail on a finding — so a failure here is never a CVE. It is not
      # necessarily a download failure either (image access, analysis and report
      # writing can fail too), which is why the enforcement step below reports the
      # observed outcomes instead of naming a stage. The `lint` job's
      # `Trivy filesystem scan` is deliberately NOT retried: it carries
      # `exit-code: "1"`, so it IS the gate, and a retry there would re-run a real
      # CVE finding. Four of the five `lint` failures in the 2026-09-11..21 window
      # were exactly that (CVE-2026-63374, anyio CRITICAL).
      #
      # ⚠️ A failure here is NOT necessarily a download failure — image access,
      # analysis and report writing can fail too. What `exit-code: "0"` rules out
      # is a FINDING as the cause; the enforcement step below therefore reports the
      # observed outcomes rather than naming a stage.
      #
      # ⚠️ The cache does NOT make the retry redundant. `trivy-action` restores the DB
      # from `actions/cache` BEFORE scanning; when trivy then decides an update is
      # required, a failed download is an ERROR — it does not silently continue on
      # the restored stale DB. *(Independent review 2026-09-22 corrected an earlier
      # comment here, and the survey text it came from, which claimed exactly that
      # fallback.)* Neither the binary fetch (via `setup-trivy`) nor the DB update
      # retries on its own, which is what these two attempts cover.
      - name: Trivy image scan (report, attempt 1)
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        timeout-minutes: 5  # downloads the trivy binary AND the vulnerability DB (~31s observed)
        with:
          image-ref: sapphire-flow:ci-${{ github.sha }}
          format: json
          output: trivy-image.json
          exit-code: "0"
          ignore-unfixed: true
          cache: "true"
      - name: Trivy image scan (report, attempt 2)
        id: trivy-scan-2
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' && steps.trivy-scan.outcome == 'failure' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        timeout-minutes: 5
        with:
          image-ref: sapphire-flow:ci-${{ github.sha }}
          format: json
          output: trivy-image.json
          exit-code: "0"
          ignore-unfixed: true
          cache: "true"
      # The mandatory decision, mirroring `Require a valid SBOM`. Keys on the
      # ARTIFACT, not on either attempt's outcome: the gate below derives everything
      # from this report, so "no report" must fail the job LOUDLY and say which
      # stage failed, rather than letting the gate silently skip.
      - name: Require a Trivy report
        id: trivy-report
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        run: |
          set -euo pipefail
          # Validate the REPORT ENVELOPE, not the presence of findings.
          # `Results` carries `omitempty` in trivy's report type, so a perfectly
          # good zero-result report can omit it entirely — an earlier version of
          # this check used `jq -e '.Results'` and would have rejected such a
          # report as a download failure (independent review 2026-09-22, medium).
          # The acceptance contract, stated because it is a judgement call:
          # a NON-EMPTY JSON OBJECT whose known fields have trivy's own types.
          #
          #   * `SchemaVersion` is `int` with `omitempty` upstream and `trivy
          #     convert` does not require it — so an omitted version is ACCEPTED,
          #     while a fractional one (2.5) is rejected because it cannot decode
          #     into that field;
          #   * `Results` is validated only WHEN PRESENT, so a clean scan that
          #     omits it is accepted.
          #
          # Deliberately permissive: a false REJECT mislabels a good scan as a
          # download failure, which is the defect this step exists to prevent,
          # whereas a false ACCEPT merely defers to `trivy convert`, which fails
          # loudly on its own. Key PRESENCE alone was not enough — `{"SchemaVersion":
          # "garbage"}` passed it (independent review 2026-09-22, medium).
          if [ -s trivy-image.json ] \
             && jq -e 'type == "object" and (length > 0) and ((has("SchemaVersion") | not) or ((.SchemaVersion | type) == "number" and (.SchemaVersion | floor) == .SchemaVersion)) and ((has("Results") | not) or (.Results | type) == "array")' trivy-image.json >/dev/null 2>&1; then
            echo "Trivy report present (SchemaVersion $(jq -r '.SchemaVersion' trivy-image.json), $(jq -r '(.Results // []) | length') result set(s))."
            exit 0
          fi

          # Report what was OBSERVED; do not name a cause that has not been
          # established. `exit-code: "0"` rules findings out as the cause, but a
          # failure here may equally be image access, analysis or report writing —
          # and if the scans never ran at all, "both attempts failed" would simply
          # be false (independent review 2026-09-22, medium).
          a1="${{ steps.trivy-scan.outcome }}"
          a2="${{ steps.trivy-scan-2.outcome }}"
          {
            echo "### Trivy image scan produced no usable report"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| scan attempt 1 | \`${a1:-not run}\` |"
            echo "| scan attempt 2 | \`${a2:-not run}\` |"
            echo "| \`trivy-image.json\` | missing, empty, or not a trivy report |"
            echo ""
            echo "This is **not** a vulnerability finding — the scan runs with"
            echo "\`exit-code: 0\` and cannot fail on findings. Check the attempt"
            echo "outcomes above before assuming which stage failed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Trivy scan produced no usable report::attempt1=${a1:-not-run} attempt2=${a2:-not-run}; this is not a CVE finding. See the job summary."
          exit 1
      # Step 2 — the gate. Renders the human-readable table straight to the job log (no
      # `--output`, unlike the old sarif-to-file step this replaces) AND fails the job via
      # --exit-code, from the SAME trivy-image.json Step 1 wrote. This is what makes
      # `trivy convert` — not the scan step — the gate (Plan 180 D1): it is the only
      # arrangement where the failing check and the printed table are the same data by
      # construction. `--severity` is applied here, not on the scan step, so the JSON
      # report keeps every severity for audit while each derived output filters
      # independently; this was verified empirically against a real HIGH finding
      # (CVE-2026-53615, the incident CVE) before shipping, not just read off
      # trivy-action's doc comment. `limit-severities-for-sarif` (used by the old gate)
      # does not apply on this path: its own comment scopes it to trivy-action's
      # SARIF-writing invocation, and this step writes `table`.
      - name: Render vulnerability table (gate)
        id: trivy-gate-table
        if: ${{ !cancelled() && steps.trivy-report.outcome == 'success' }}
        run: |
          trivy convert \
            --format table \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            trivy-image.json
      # Step 3 — derive the SARIF from the same report. Deliberately has NO exit-code and
      # runs even when Step 2 failed the gate (`!cancelled()`, not the implicit
      # `success()`) — the SARIF must still reach code scanning on the failure path, since
      # that is the run that matters (T2 acceptance). It only requires that Step 1's
      # report exists.
      - name: Convert report to SARIF
        id: trivy-sarif
        if: ${{ !cancelled() && steps.trivy-report.outcome == 'success' }}
        run: |
          trivy convert \
            --format sarif \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --output trivy-image.sarif \
            trivy-image.json
      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        timeout-minutes: 3  # uploads to the Actions artifact store (~2s observed)
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          if-no-files-found: warn
      # T2 — publish to the GitHub Security tab, the SARIF's only real consumer
      # (upload-artifact above just archives a zip nothing reads — that was the
      # incident's second root cause). NOT wrapped in a blanket continue-on-error: a
      # broken upload (bad token, malformed SARIF, path typo, licensing lapse) must fail
      # the job loudly — the same silent-failure class this plan exists to close, moved
      # one level down (Plan 180 traps). Runs whenever Step 3 produced a SARIF,
      # independent of whether Step 2's gate failed — the failure-path run is the one that
      # matters.
      - name: Upload Trivy SARIF to code scanning
        if: ${{ !cancelled() && steps.trivy-sarif.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        timeout-minutes: 3  # posts to the code-scanning API (~8s observed)
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      # B4 — SBOM generation (Plan 309). `syft` emits CycloneDX JSON for the built
      # image, uploaded as an artifact on every run so a future CVE landing has a
      # recoverable "which image contains library X?" trail.
      #
      # Plan 207: conditioned on the IMAGE BUILD, not trivy-scan — the SBOM reads
      # the image, not trivy-image.json, so a gate failure (or an operational Trivy
      # failure) must not delete the inventory. `!cancelled()`, not the implicit
      # `success()`: the failure-path run is the one where "what else ships this
      # component?" matters (cicd.md:627, "every run").
      #
      # Plan 309 splits this into DOWNLOAD (retried) + EXECUTE (once) + ENFORCE.
      # Three things make that split necessary rather than decorative:
      #
      #  1. A GitHub 504 on the syft release URL failed this job three times in
      #     19 minutes on 2026-09-21 (PR #286) while every other check, including
      #     the CVE gate, passed. syft never installed, so it never ran — nothing
      #     was learned about the image, and the red mark said otherwise.
      #  2. `continue-on-error` on an attempt fixes that step's CONCLUSION; every
      #     later step still needs `!cancelled() && steps.build-image.outcome ==
      #     'success'`, because a step `if:` without a status function carries an
      #     implicit success() and the job may already be red from the CVE gate.
      #     Without those guards an SBOM failure under a red Trivy gate would skip
      #     every retry AND the enforcement step.
      #  3. Each step carries its own `timeout-minutes`. The JOB-level timeout
      #     CANCELS, which skips every `!cancelled()` step — no enforcement, no
      #     message, no upload.
      #
      # D1 (owner, 2026-09-21): three attempts, waits of 4 and 6 minutes.
      # Measured: a rejected download fails in 0-11s; a healthy install+scan takes
      # 20s; this step starts ~2m49s into a 30-minute job. Worst case here (every
      # attempt stalling to its 3-minute bound) is ~19 minutes, inside that budget.
      # Nothing establishes that 4+6 would have covered the 2026-09-21 outage —
      # the recovery point was never sampled. It is a policy choice, not a
      # derived one.
      - name: Download syft (attempt 1)
        id: syft-dl-1
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
      - name: Wait 4 minutes before retrying the syft download
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' && steps.syft-dl-1.outcome == 'failure' }}
        run: |
          echo "::warning title=syft download failed::Attempt 1 could not obtain syft. Retrying in 4 minutes."
          sleep 240
      - name: Download syft (attempt 2)
        id: syft-dl-2
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' && steps.syft-dl-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
      - name: Wait 6 minutes before the final syft download attempt
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' && steps.syft-dl-1.outcome == 'failure' && steps.syft-dl-2.outcome == 'failure' }}
        run: |
          echo "::warning title=syft download failed::Attempt 2 could not obtain syft. Retrying in 6 minutes."
          sleep 360
      - name: Download syft (attempt 3)
        id: syft-dl-3
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' && steps.syft-dl-1.outcome == 'failure' && steps.syft-dl-2.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
      # Select the first attempt that produced a syft binary. A DOWNLOAD produces a
      # command path, not an SBOM — install success is not artifact readiness, which
      # is why execution below is a separate step with its own outcome.
      - name: Resolve the syft command
        id: syft-cmd
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        run: |
          cmd="${{ steps.syft-dl-1.outputs.cmd }}"
          [ -z "$cmd" ] && cmd="${{ steps.syft-dl-2.outputs.cmd }}"
          [ -z "$cmd" ] && cmd="${{ steps.syft-dl-3.outputs.cmd }}"
          if [ -z "$cmd" ]; then
            echo "installed=false" >> "$GITHUB_OUTPUT"
            echo "No syft binary from any of the 3 download attempts."
          else
            echo "installed=true" >> "$GITHUB_OUTPUT"
            echo "cmd=$cmd" >> "$GITHUB_OUTPUT"
            echo "Using syft at: $cmd"
          fi
      # EXECUTE — once, bounded, and with the parent action's own environment.
      # SYFT_CHECK_FOR_APP_UPDATE=false is set by anchore/sbom-action itself
      # (src/github/SyftGithubAction.ts:127) and NOT by the download sub-action.
      # Omitting it would add an outbound update check to the step whose entire
      # problem is outbound network calls.
      - name: Generate SBOM with syft
        id: sbom-generate
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' && steps.syft-cmd.outputs.installed == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          # Image reference passed BARE, exactly as anchore/sbom-action does when
          # no registry credentials are configured (SyftGithubAction.ts:151-157) —
          # not `docker:`-prefixed. `-o <format>=<path>` writes the file directly
          # instead of via stdout, which the parent also keeps out of the log.
          "${{ steps.syft-cmd.outputs.cmd }}" scan \
            "sapphire-flow:ci-${{ github.sha }}" \
            -o cyclonedx-json="sbom.cdx.json"
      # ENFORCE — the only step here without `continue-on-error`. It keys on the
      # ARTIFACT, not on any step's outcome, and it reports the stage that actually
      # failed rather than a fixed cause: "could not obtain the tool" is false when
      # syft ran and wrote nothing.
      - name: Require a valid SBOM
        id: sbom-require
        if: ${{ !cancelled() && steps.build-image.outcome == 'success' }}
        run: |
          set -euo pipefail
          installed="${{ steps.syft-cmd.outputs.installed }}"
          ran="${{ steps.sbom-generate.outcome }}"

          valid=false
          if [ -s sbom.cdx.json ] \
             && jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' sbom.cdx.json >/dev/null 2>&1; then
            valid=true
          fi

          if [ "$valid" = "true" ]; then
            echo "SBOM present and valid ($(jq '.components | length' sbom.cdx.json) components)."
            exit 0
          fi

          if [ "$installed" != "true" ]; then
            stage="syft could not be DOWNLOADED after 3 attempts over ~10 minutes."
            advice="This is a fault on the download path (the syft release URL), NOT a finding about the image. A re-run is the first response."
          elif [ "$ran" = "failure" ]; then
            stage="syft was downloaded and RAN, but the scan failed. See the step log above."
            advice="This is about the image or the scan, not the download. Do not assume a re-run fixes it."
          else
            stage="syft downloaded and the scan reported success, but sbom.cdx.json is missing, empty or not valid CycloneDX."
            advice="Neither stage reported a failure, so this needs a human look rather than a re-run."
          fi

          {
            echo "### SBOM generation failed"
            echo ""
            echo "$stage"
            echo ""
            echo "$advice"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=SBOM generation failed::$stage $advice"
          exit 1
      # Gated on the ENFORCEMENT step, not on execution and not on any download
      # attempt. A download yields a command path, never an SBOM; and syft can exit
      # 0 having written nothing, in which case `sbom-generate.outcome == 'success'`
      # while there is no file — the upload then fails on `if-no-files-found: error`,
      # adding a confusing second error beside the real one. (Measured: Plan 309
      # verification run D, 35622426919.) `!cancelled()` is retained deliberately so
      # the SBOM still uploads when the CVE gate has already failed the job — the
      # Plan 207 property.
      - name: Upload SBOM artifact
        id: sbom-upload
        if: ${{ !cancelled() && steps.sbom-require.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        timeout-minutes: 3  # uploads to the Actions artifact store (~2s observed)
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  # Phase 11 — full end-to-end pipeline test (dedicated testcontainer, ~9 min).
  # Requires Docker for testcontainers (available on ubuntu-latest by default).
  # Gated on build-image-and-scan per Plan 064 B0 step 5 and B3 step 3.
