name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Plan 159 follow-up. `uv.lock` carries a PRIVATE git dependency (aquacast, an
# optional extra). `uv sync --frozen` honours the lock and never fetches it, but a
# bare `uv run` re-resolves and DOES try to clone it — which fails with
# "could not read Username" on any runner without an aquacast token. Setting
# UV_FROZEN makes every uv invocation respect the lock, so CI needs no aquacast
# credential unless it actually installs the extra.
env:
  UV_FROZEN: "1"

# A new push to a PR branch makes the in-flight run obsolete: nobody reads the
# result of a run against a commit that is no longer the head. Cancel it and
# free the runner. NOT applied to `main` — every commit that lands there is a
# distinct state someone may need a verdict on, and cancelling would leave
# gaps in the record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.7"
          python-version: "3.12"
      # recap-dg-client is a private repo (Plan 082 Task 2H) — every job that
      # runs `uv sync` clones it, so git needs authenticated HTTPS access.
      # Scoped via insteadOf to ONLY this repo URL.
      - name: Configure git auth for the private clones
        run: |
          git config --global url."https://x-access-token:${RECAP_DG_CLIENT_TOKEN}@github.com/hydrosolutions/recap-dg-client.git".insteadOf "https://github.com/hydrosolutions/recap-dg-client.git"
          # aquacast (Plan 159) is only reachable when the secret is set. Guarded so
          # the rewrite is never written with an EMPTY token: an empty credential
          # turns a would-be 404 into a confusing auth failure, and CI does not
          # install the `aquacast` extra by default anyway.
          if [ -n "${AQUACAST_TOKEN}" ]; then
            git config --global url."https://x-access-token:${AQUACAST_TOKEN}@github.com/hydrosolutions/aquacast.git".insteadOf "https://github.com/hydrosolutions/aquacast.git"
          fi
        env:
          RECAP_DG_CLIENT_TOKEN: ${{ secrets.RECAP_DG_CLIENT_TOKEN }}
          AQUACAST_TOKEN: ${{ secrets.AQUACAST_TOKEN }}
      - run: uv sync --frozen
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      # -x: follow `source` (Plan 199 T2 — docker-endpoint.sh is sourced by
      # four wrappers below; plain shellcheck flags the `source` line as
      # SC1091). Plan 199 also adds prune-docker.sh, run-nepal-forcing.sh
      # and docker-endpoint.sh itself, previously omitted from this list.
      - run: shellcheck -x scripts/launchd/start-sapphire.sh scripts/launchd/watchdog.sh scripts/launchd/install-launchd.sh scripts/launchd/run-recap-probe.sh scripts/launchd/prune-docker.sh scripts/launchd/run-nepal-forcing.sh scripts/launchd/docker-endpoint.sh scripts/bootstrap-mac-mini.sh
      - run: uv run pyright --outputjson src/ > /tmp/pyright.json || true
      - run: uv run python tools/pyright_ratchet.py /tmp/pyright.json tools/pyright_baseline.json
      # A2 — Trivy filesystem scan. Reads uv.lock + pyproject.toml without
      # building the image, so dep-only PRs get fast feedback. Fails on HIGH
      # or CRITICAL vulnerabilities that have an available fix; unfixed CVEs
      # are ignored to avoid blocking on upstream work we cannot action.
      # Known-accepted CVEs live in .trivyignore with dated comments.
      # `skip-dirs: .venv` because `uv sync` ran earlier in this job and
      # trivy would otherwise descend into Prefect's bundled JS UI assets
      # (lodash, vega, ...) — those live inside an installed package and
      # are the image-scan tier's responsibility, not the fs-scan tier's.
      # Equivalent CLI: trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --skip-dirs .venv .
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          skip-dirs: .venv
          cache: "true"

  unit:
    runs-on: ubuntu-latest
    # Plan 185 D6 — pinned exactly. Specifying ANY permissions block zeroes the
    # unspecified ones, so contents: read must be restated here or checkout
    # breaks; pull-requests: read is new, for the `gh api` lock-change check
    # below.
    permissions: { contents: read, pull-requests: read }
    timeout-minutes: 25
    env:
      # Plan 185 D2 — read once at job level: a step-level `if:` cannot
      # reference `secrets.*` directly, but it CAN read the `env` context,
      # which a job-level `env:` can populate from a secret.
      AQUACAST_TOKEN_PRESENT: ${{ secrets.AQUACAST_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.7"
          python-version: "3.12"
      - name: Install system deps for cfgrib / rioxarray / exactextract
        # A stalled acquisition here used to eat the whole 25-minute job budget
        # and surface as a test failure. Bounding it with apt's own transport
        # knobs (Retries/Timeout) turned that into a fast, correctly-attributed
        # failure — but did NOT make it pass: on 2026-08-19 the step stalled
        # EIGHT times, in windows where the same command on a sibling runner
        # finished in ~75s. Acquire::Retries retries inside ONE apt process,
        # which keeps using the endpoint it already resolved; if that endpoint
        # is the sick one, three retries just burn the budget against it three
        # times. A FRESH apt-get process re-resolves DNS and can land somewhere
        # healthy — so the retry has to be at process level.
        #
        # Only `update` is retried this way. It writes package lists and no
        # dpkg state, so abandoning one is safe. `install` is NOT wrapped:
        # killing it mid-unpack can leave pending configuration behind, and no
        # lock file is ever deleted (locks are process-bound and released when
        # the holder dies).
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # Bypass azure.archive.ubuntu.com. The runner's sources use a
          # mirrorlist (file:/etc/apt/apt-mirrors.txt) pointing at Azure's
          # Ubuntu mirror, and on 2026-08-19 that ONE host stalled ~10 times
          # while every other repo in the same `apt-get update` — dl.google.com,
          # packages.microsoft.com — answered instantly. Retrying could never
          # fix it: a fresh process re-resolves the same hostname to the same
          # degraded service. Point at Canonical's archive instead. Slightly
          # further from the runner than a same-datacentre mirror; a few
          # seconds against ten lost runs.
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          APT_OPTS=(-o Acquire::Retries=3
                    -o Acquire::http::Timeout=30
                    -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=10 90 apt-get "${APT_OPTS[@]}" update; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::apt-get update stalled or failed on 3 separate attempts"
              exit 1
            fi
            echo "::warning::apt-get update attempt $attempt stalled; retrying in a fresh process"
            sleep 5
          done
          sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            libeccodes0 libexpat1 libgeos-c1v5
      - name: Configure git auth for the private clones
        run: |
          git config --global url."https://x-access-token:${RECAP_DG_CLIENT_TOKEN}@github.com/hydrosolutions/recap-dg-client.git".insteadOf "https://github.com/hydrosolutions/recap-dg-client.git"
          # aquacast (Plan 159) is only reachable when the secret is set. Guarded so
          # the rewrite is never written with an EMPTY token: an empty credential
          # turns a would-be 404 into a confusing auth failure. The `unit` job DOES
          # install the `aquacast` extra by default whenever the token reaches this
          # run — see the AQUACAST_TOKEN_PRESENT-gated install steps below.
          if [ -n "${AQUACAST_TOKEN}" ]; then
            git config --global url."https://x-access-token:${AQUACAST_TOKEN}@github.com/hydrosolutions/aquacast.git".insteadOf "https://github.com/hydrosolutions/aquacast.git"
          fi
        env:
          RECAP_DG_CLIENT_TOKEN: ${{ secrets.RECAP_DG_CLIENT_TOKEN }}
          AQUACAST_TOKEN: ${{ secrets.AQUACAST_TOKEN }}
      # Plan 185 — GitHub withholds the Actions-store copy of a secret from
      # runs it attributes to Dependabot; a same-named secret in the
      # separate Dependabot store is substituted in instead (see
      # docs/standards/cicd.md). AQUACAST_TOKEN is mirrored into both stores,
      # so AQUACAST_TOKEN_PRESENT is normally true even on those runs — this
      # guard exists for when it ISN'T: a new private dependency's secret not
      # yet mirrored into the Dependabot store, or either copy deleted or
      # misconfigured. That attribution is keyed on
      # `github.actor` — the identity that triggered THIS run — not on the
      # PR's author: a maintainer can push a further commit onto a
      # Dependabot-opened branch, and that push (and the `pull_request`
      # `synchronize` event it fires) runs as the maintainer, with secrets
      # restored. Checking `github.event.pull_request.user.login` instead
      # would still read "dependabot[bot]" for that human-triggered run and
      # misclassify a real missing-credential failure as an expected
      # degrade. Detect whether THIS PR touches uv.lock — the one case
      # where the extra's resolution can actually change (D1 case 3) — so
      # the steps below can tell "safe to degrade" apart from "must fail".
      # Guarded to the one case that needs it: never consulted on `push`,
      # where the token is present anyway (case 1) and
      # `github.event.pull_request.number` would be empty, which `gh`
      # treats as "no selector" and falls back to guessing a PR from the
      # branch.
      - name: Detect uv.lock change (Dependabot degraded-coverage guard)
        if: >-
          env.AQUACAST_TOKEN_PRESENT != 'true' &&
          github.event_name == 'pull_request' &&
          github.actor == 'dependabot[bot]'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # `--paginate` does not lift the pull-request-files endpoint's own
          # hard 3000-file cap: past that many changed files the response is
          # silently incomplete no matter how many pages are fetched, so a
          # uv.lock touch outside the returned set would read as "no change".
          # Read the PR's own changed_files count first and fail closed (as
          # if uv.lock changed) rather than trust a listing that might be cut
          # short.
          count=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.changed_files') || count=""
          # Reject empty AND non-numeric: `[ "$count" -gt 3000 ]` exits 2 on a
          # non-number, and `bash -e` does NOT abort on a failed `elif` CONDITION,
          # so a malformed count (jq yields "null" when the field is absent) would
          # fall through to the listing and could set UV_LOCK_CHANGED=false.
          if ! [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read this PR's changed-file count via gh (got '${count}'); failing closed (treating as if uv.lock changed)."
            echo "UV_LOCK_CHANGED=true" >> "$GITHUB_ENV"
          elif [ "$count" -gt 3000 ]; then
            echo "::error::This PR touches $count files, past the pull-request-files API's 3000-file hard cap; the file listing could be incomplete. Failing closed (treating as if uv.lock changed)."
            echo "UV_LOCK_CHANGED=true" >> "$GITHUB_ENV"
          elif gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/pr-files.txt"; then
            if grep -qxF 'uv.lock' "$RUNNER_TEMP/pr-files.txt"; then
              echo "UV_LOCK_CHANGED=true" >> "$GITHUB_ENV"
            else
              echo "UV_LOCK_CHANGED=false" >> "$GITHUB_ENV"
            fi
          else
            # Capture the command's success BEFORE testing its output: an API
            # failure must fail closed, never read as "no lock change".
            echo "::error::Could not read this PR's changed files via gh; failing closed (treating as if uv.lock changed)."
            echo "UV_LOCK_CHANGED=true" >> "$GITHUB_ENV"
          fi
      # D1 case 3 — token absent, and NOT the one case (Dependabot-actor
      # run, uv.lock untouched) that is allowed to degrade instead. Covers
      # both "the secret was deleted/misconfigured" and "this PR changes
      # uv.lock", which is where the extra's resolution is most likely to
      # actually break (OD-2).
      - name: AQUACAST_TOKEN absent — fail
        if: >-
          env.AQUACAST_TOKEN_PRESENT != 'true' &&
          !(github.event_name == 'pull_request' &&
            github.actor == 'dependabot[bot]' &&
            env.UV_LOCK_CHANGED == 'false')
        run: |
          echo "::error::AQUACAST_TOKEN is not available to this run. GitHub structurally withholds Actions secrets from runs it attributes to Dependabot, so this may be expected — but a deleted/misconfigured secret looks identical, and a PR that changes uv.lock cannot skip the extra either way. Mirror AQUACAST_TOKEN into BOTH the Actions and Dependabot secret stores (Settings > Secrets and variables), matching RECAP_DG_CLIENT_TOKEN."
          exit 1
      # `--extra aquacast` ONLY here (owner, 2026-08-18), and only when the
      # token actually reached this run (Plan 185 D1 case 1) — otherwise the
      # shim's tests skip via importorskip and the aquacast boundary is
      # exercised on nobody's machine but the author's, a weak position for
      # code that will feed operational forecasts. It costs a torch download
      # on this one job; every other job stays on the plain sync.
      - name: Install (aquacast extra)
        if: env.AQUACAST_TOKEN_PRESENT == 'true'
        run: uv sync --frozen --extra aquacast
      # D1 case 2 / D3 — token absent, Dependabot-actor run, uv.lock
      # untouched: degrade loudly instead of failing red. The plain sync
      # still runs everything else in tests/unit/; only the aquacast shim's
      # own tests (behind importorskip) lose coverage on this run.
      - name: Install (no aquacast extra — degraded)
        if: >-
          env.AQUACAST_TOKEN_PRESENT != 'true' &&
          github.event_name == 'pull_request' &&
          github.actor == 'dependabot[bot]' &&
          env.UV_LOCK_CHANGED == 'false'
        run: |
          uv sync --frozen
          echo "::warning::AQUACAST_TOKEN is not available to this Dependabot-triggered run (GitHub withholds Actions secrets from Dependabot by design). Installed WITHOUT the aquacast extra — tests/unit/models/test_aquacast_shim.py is skipped via importorskip, so aquacast-shim coverage did not run for this PR."
      # D4 — exit status alone is not sufficient: verified locally, without
      # the extra this exact node reports a collector error plus "1 skipped"
      # and still exits non-zero. Assert on pytest's own summary line so the
      # installed case PROVES the shim test ran, not just that the process
      # didn't crash. Because exactly one node is requested, no other test
      # can satisfy the grep.
      - name: Prove the aquacast shim test ran
        if: env.AQUACAST_TOKEN_PRESENT == 'true'
        run: |
          set -o pipefail
          uv run pytest 'tests/unit/models/test_aquacast_shim.py::TestRealDiscovery::test_discover_models_returns_the_aquacast_model' -q --color=no | tee "$RUNNER_TEMP/aquacast-shim.txt"
          grep -Fq '1 passed' "$RUNNER_TEMP/aquacast-shim.txt"
      # -n auto: the unit suite is ~3700 tests and was the whole critical path
      # (~15 min of a ~16 min job; setup is only ~70 s). Verified parallel-safe
      # on 2026-08-18 — a full `tests/unit/ -n auto` run passed with workers
      # sharing one PREFECT_HOME. Dropped `-v`: thousands of PASSED lines that
      # nobody reads on a green run and that bury the failure on a red one.
      - run: uv run pytest tests/unit/ -n auto --cov=src/sapphire_flow --cov-report=term-missing

  # A4 — Wheel-only guard for dependency-update installs.
  #
  # Step 1 below is the wheel-only guard: it runs `uv sync --frozen
  # --no-build --no-cache --no-install-project --no-install-package
  # forecastinterface` on GitHub-hosted amd64 to make CI the first execution
  # environment for new dependency versions and to fail if any non-excepted
  # package introduces new Python build-backend / sdist source execution on
  # this platform. `--no-cache` is required because cached pre-built wheels
  # would otherwise mask a newly-required source build. `--no-install-project`
  # skips the local editable root package (which has no binary distribution
  # by design) so the guard only checks third-party dependencies — the actual
  # target of this control.
  #
  # Runs on every PR and push; the guard is fast enough that scoping to
  # pyproject.toml / uv.lock changes is not necessary. Any merged
  # dependency change is therefore guaranteed to have exercised the guard.
  #
  # Known source-build exceptions: `forecastinterface` is the temporary CI
  # exception and is installed only after step 1 succeeds; `exactextract` may
  # require a source build in the linux/arm64 Docker builder path.
  # `recap-dg-client` (Plan 082 Task 2H) is a second temporary git-pin
  # exception, same shape as forecastinterface — Nepal v1 recap Gateway
  # client, no published wheel index. Removal trigger: once
  # `recap-dg-client` is published to the hydrosolutions private package
  # index and CI/Docker can install it as a wheel with no source build,
  # drop this exception (tracked as an IT-specialist Plan 080-style
  # follow-up). Any new exception must be documented in
  # docs/standards/security.md per Plan 064 A4 step 3.
  wheel-only-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.7"
          python-version: "3.12"
          # Disable setup-uv's cache feature in this job: the wheel-only
          # guard uses `uv sync --no-cache`, so no cache directory is
          # populated. setup-uv v8+ errors on missing cache at post-run;
          # explicitly disabling here makes the job v4/v8 compatible
          # (Dependabot PR #4 surfaced this).
          enable-cache: false
      # recap-dg-client is a PRIVATE repo (hydrosolutions/recap-dg-client) —
      # both wheel-guard steps below clone it, so git needs authenticated
      # HTTPS access before either `uv sync` runs. Scoped via insteadOf to
      # ONLY this repo URL (never a blanket github.com credential rewrite).
      - name: Configure git auth for the private clones
        run: |
          git config --global url."https://x-access-token:${RECAP_DG_CLIENT_TOKEN}@github.com/hydrosolutions/recap-dg-client.git".insteadOf "https://github.com/hydrosolutions/recap-dg-client.git"
          # aquacast (Plan 159) is only reachable when the secret is set. Guarded so
          # the rewrite is never written with an EMPTY token: an empty credential
          # turns a would-be 404 into a confusing auth failure, and CI does not
          # install the `aquacast` extra by default anyway.
          if [ -n "${AQUACAST_TOKEN}" ]; then
            git config --global url."https://x-access-token:${AQUACAST_TOKEN}@github.com/hydrosolutions/aquacast.git".insteadOf "https://github.com/hydrosolutions/aquacast.git"
          fi
        env:
          RECAP_DG_CLIENT_TOKEN: ${{ secrets.RECAP_DG_CLIENT_TOKEN }}
          AQUACAST_TOKEN: ${{ secrets.AQUACAST_TOKEN }}
      - run: |
          set -euo pipefail
          # step 1 IS the guard — must keep --no-build and must precede step 2; step 2 has no --no-build and may build ONLY the excepted packages.
          uv sync --frozen --no-build --no-cache --no-install-project --no-install-package forecastinterface --no-install-package recap-dg-client
          uv sync --frozen --no-cache --no-install-project --reinstall-package forecastinterface --reinstall-package recap-dg-client

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5  # postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sapphire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.7"
          python-version: "3.12"
      - name: Install system deps for cfgrib / rioxarray / exactextract
        # A stalled acquisition here used to eat the whole 25-minute job budget
        # and surface as a test failure. Bounding it with apt's own transport
        # knobs (Retries/Timeout) turned that into a fast, correctly-attributed
        # failure — but did NOT make it pass: on 2026-08-19 the step stalled
        # EIGHT times, in windows where the same command on a sibling runner
        # finished in ~75s. Acquire::Retries retries inside ONE apt process,
        # which keeps using the endpoint it already resolved; if that endpoint
        # is the sick one, three retries just burn the budget against it three
        # times. A FRESH apt-get process re-resolves DNS and can land somewhere
        # healthy — so the retry has to be at process level.
        #
        # Only `update` is retried this way. It writes package lists and no
        # dpkg state, so abandoning one is safe. `install` is NOT wrapped:
        # killing it mid-unpack can leave pending configuration behind, and no
        # lock file is ever deleted (locks are process-bound and released when
        # the holder dies).
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # Bypass azure.archive.ubuntu.com. The runner's sources use a
          # mirrorlist (file:/etc/apt/apt-mirrors.txt) pointing at Azure's
          # Ubuntu mirror, and on 2026-08-19 that ONE host stalled ~10 times
          # while every other repo in the same `apt-get update` — dl.google.com,
          # packages.microsoft.com — answered instantly. Retrying could never
          # fix it: a fresh process re-resolves the same hostname to the same
          # degraded service. Point at Canonical's archive instead. Slightly
          # further from the runner than a same-datacentre mirror; a few
          # seconds against ten lost runs.
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          APT_OPTS=(-o Acquire::Retries=3
                    -o Acquire::http::Timeout=30
                    -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=10 90 apt-get "${APT_OPTS[@]}" update; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::apt-get update stalled or failed on 3 separate attempts"
              exit 1
            fi
            echo "::warning::apt-get update attempt $attempt stalled; retrying in a fresh process"
            sleep 5
          done
          sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            libeccodes0 libexpat1 libgeos-c1v5
      - name: Configure git auth for the private clones
        run: |
          git config --global url."https://x-access-token:${RECAP_DG_CLIENT_TOKEN}@github.com/hydrosolutions/recap-dg-client.git".insteadOf "https://github.com/hydrosolutions/recap-dg-client.git"
          # aquacast (Plan 159) is only reachable when the secret is set. Guarded so
          # the rewrite is never written with an EMPTY token: an empty credential
          # turns a would-be 404 into a confusing auth failure, and CI does not
          # install the `aquacast` extra by default anyway.
          if [ -n "${AQUACAST_TOKEN}" ]; then
            git config --global url."https://x-access-token:${AQUACAST_TOKEN}@github.com/hydrosolutions/aquacast.git".insteadOf "https://github.com/hydrosolutions/aquacast.git"
          fi
        env:
          RECAP_DG_CLIENT_TOKEN: ${{ secrets.RECAP_DG_CLIENT_TOKEN }}
          AQUACAST_TOKEN: ${{ secrets.AQUACAST_TOKEN }}
      - run: uv sync --frozen
      - run: uv run pytest tests/integration/ --ignore=tests/integration/live -v -m "not slow"
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sapphire_test

  # B0 + B3 + B4 — Build the app image in CI and scan it in the same job.
  #
  # Why one job: GitHub-hosted jobs run on fresh VMs. A local docker image
  # built in one job is NOT available in another job. So build, trivy image,
  # and syft must share a runner context (or an image tarball must be
  # explicitly uploaded as an artifact and re-loaded). We keep all three
  # steps in this single job for simplicity.
  #
  # The e2e job gates on this job succeeding (see `needs:` below).
  build-image-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # security-events: write is required by github/codeql-action/upload-sarif
    # (T2, Plan 180). contents: read is the checkout minimum. Declared
    # explicitly rather than relying on the repo's ambient
    # default-workflow-permissions setting, which is a per-repo config that
    # can change independently of this file.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      # B0 — Build the image and load it into the local docker daemon so the
      # later trivy and syft steps in this same job can reference the tag.
      - name: Build app image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          tags: sapphire-flow:ci-${{ github.sha }}
          load: true
          push: false
          # recap-dg-client is a private repo (Plan 082 Task 2H) — the
          # builder stage's `uv sync` clones it via a BuildKit secret mount
          # (Dockerfile), never baked into an image layer.
          secrets: |
            recap_dg_client_token=${{ secrets.RECAP_DG_CLIENT_TOKEN }}
      # B3 — Trivy image scan, restructured (Plan 180) into scan-once/derive-many so a
      # failure explains itself instead of printing a bare `exit code 1` (the
      # 2026-08-17 incident: `format: sarif` + file `output:` prints nothing to the log):
      #
      #   scan (JSON, non-gating) -> convert --format table (the gate, printed to the log)
      #                           -> convert --format sarif (code-scanning upload, T2)
      #
      # Deriving both outputs from the SAME trivy-image.json means the printed table and
      # the SARIF are provably the same data as what failed the gate — re-scanning on the
      # failure path instead could disagree with the run that actually gated (a different
      # advisory-DB state).
      #
      # Step 1 — scan to JSON. exit-code is explicitly "0": this step is non-gating for
      # *findings* (the convert step below is the gate) but still fails closed on a real
      # operational error (DB fetch, render, setup failure), per trivy-action's normal
      # exit-code semantics — GitHub's implicit success() then correctly skips every step
      # after it, including the gate. ignore-unfixed stays true and lives HERE: `trivy
      # convert` has no --ignore-unfixed flag, so it can only be applied at scan time —
      # verified empirically (Plan 180 T1), not assumed. Covers OS-level layers the fs
      # scan (A2) does not see.
      - name: Trivy image scan (report)
        id: trivy-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: sapphire-flow:ci-${{ github.sha }}
          format: json
          output: trivy-image.json
          exit-code: "0"
          ignore-unfixed: true
          cache: "true"
      # Step 2 — the gate. Renders the human-readable table straight to the job log (no
      # `--output`, unlike the old sarif-to-file step this replaces) AND fails the job via
      # --exit-code, from the SAME trivy-image.json Step 1 wrote. This is what makes
      # `trivy convert` — not the scan step — the gate (Plan 180 D1): it is the only
      # arrangement where the failing check and the printed table are the same data by
      # construction. `--severity` is applied here, not on the scan step, so the JSON
      # report keeps every severity for audit while each derived output filters
      # independently; this was verified empirically against a real HIGH finding
      # (CVE-2026-53615, the incident CVE) before shipping, not just read off
      # trivy-action's doc comment. `limit-severities-for-sarif` (used by the old gate)
      # does not apply on this path: its own comment scopes it to trivy-action's
      # SARIF-writing invocation, and this step writes `table`.
      - name: Render vulnerability table (gate)
        id: trivy-gate-table
        if: ${{ !cancelled() && steps.trivy-scan.outcome == 'success' }}
        run: |
          trivy convert \
            --format table \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            trivy-image.json
      # Step 3 — derive the SARIF from the same report. Deliberately has NO exit-code and
      # runs even when Step 2 failed the gate (`!cancelled()`, not the implicit
      # `success()`) — the SARIF must still reach code scanning on the failure path, since
      # that is the run that matters (T2 acceptance). It only requires that Step 1's
      # report exists.
      - name: Convert report to SARIF
        id: trivy-sarif
        if: ${{ !cancelled() && steps.trivy-scan.outcome == 'success' }}
        run: |
          trivy convert \
            --format sarif \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --output trivy-image.sarif \
            trivy-image.json
      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          if-no-files-found: warn
      # T2 — publish to the GitHub Security tab, the SARIF's only real consumer
      # (upload-artifact above just archives a zip nothing reads — that was the
      # incident's second root cause). NOT wrapped in a blanket continue-on-error: a
      # broken upload (bad token, malformed SARIF, path typo, licensing lapse) must fail
      # the job loudly — the same silent-failure class this plan exists to close, moved
      # one level down (Plan 180 traps). Runs whenever Step 3 produced a SARIF,
      # independent of whether Step 2's gate failed — the failure-path run is the one that
      # matters.
      - name: Upload Trivy SARIF to code scanning
        if: ${{ !cancelled() && steps.trivy-sarif.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      # B4 — SBOM generation. anchore/sbom-action wraps syft; emits
      # CycloneDX JSON for the built image. Uploaded as an artifact on every
      # run so a future CVE landing has a recoverable "which image contains
      # library X?" trail.
      # Equivalent CLI: syft sapphire-flow:ci-${{ github.sha }} -o cyclonedx-json > sbom.cdx.json
      - name: Generate SBOM with syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: sapphire-flow:ci-${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  # Phase 11 — full end-to-end pipeline test (dedicated testcontainer, ~9 min).
  # Requires Docker for testcontainers (available on ubuntu-latest by default).
  # Gated on build-image-and-scan per Plan 064 B0 step 5 and B3 step 3.
